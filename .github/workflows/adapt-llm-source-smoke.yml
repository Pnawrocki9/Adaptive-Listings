name: Adapt LLM-source canary (FOLLOW-1022)

# Answers one question that no other check answers: is production `/api/adapt` actually
# GENERATING copy, or quietly serving playbook templates?
#
# On 2026-08-17 every production adapt decision came back
# `"source": "playbook_fallback_llm_unavailable"` while the LLM was up, was called and was
# billed — and CI was fully green throughout, because a fallback is a 200 with directives in
# it. FOLLOW-1022 fixed the cause (the model was never shown the listing's own facts, so the
# post-generation fact check discarded everything). This workflow fixes the silence.
#
# Skip-loud contract (mirrors intent-weights-live-smoke.yml / RETRO-007):
#   secrets absent                      → soft-skip with ::notice:: in the spec output
#   REQUIRE_LIVE_ADAPT_SMOKE=1 + absent → spec throws (hard-fail)
#   secrets present + LLM path dead     → assertion fails (hard-fail)
#
# PREDICATE, NARROWED 2026-08-20 [FOLLOW-1056 AC(7)]. This job used to be red on ANY
# `source: playbook_fallback_llm_unavailable`, and that one value covers two OPPOSITE worlds:
# the LLM was unavailable (an incident) and the model wrote ungrounded copy that the fact check
# refused to serve (the pipeline working, fail-closed). It went red for each of them on
# 2026-08-20 — runs 32370637849 and 32372181392 — each with a sibling run on identical content
# passing within 105 s and 4 s. The spec now reads the response's `fallback_reason` and is red
# only for the first world; a `fact_check_refused` run passes and prints its verdict as a
# ::notice::. An ABSENT `fallback_reason` on a fallback stays red on purpose (the deployed build
# predates the field, so the two worlds are still indistinguishable on the wire).
#
# SECOND AXIS, CLOSED 2026-08-21 [FOLLOW-1059]. The narrowing above fixed what a RED means and
# left what a GREEN means untouched: the probe sent no `holdout_pct`, so `/api/adapt` defaulted it
# into the 10% A/B holdout, which returns `source: "default"` BEFORE any LLM call — and the spec's
# predicate scored that as a pass. 15 of the 136 canary decision rows ever written (11.0%) are
# exactly that, including run 32422989097 (2026-08-20 22:10:25), whose log reads
# `verdict=generated source="default"`, and including the green RETRO-290 §9 cited as proof that a
# production failure was transient. The probe now sends `holdout_pct: 0` and a response that never
# reached the band is RED as `band_not_exercised` — UNDETERMINED, distinct from an outage, because
# reporting a holdout assignment as an outage would re-introduce the conflation the paragraph above
# just removed.
#
# The job `name:` below is deliberately NOT renamed to match, and that is a decision, not an
# oversight: two live artefacts key off the exact string — backlog/ESCALATIONS.md ESC-062 step 2
# (which instructs a future PR to add that literal name to .github/required-checks.txt) and the
# open FOLLOW-1028 stub. Renaming here would invalidate an operator instruction elsewhere for a
# cosmetic gain. The predicate of record is this block and the spec, not the parenthetical.
#
# ESC-062: ESTALARA_SMOKE_TENANT_ID is NOT yet provisioned as a GitHub Actions secret
# (ESTALARA_SMOKE_DECISION_API_URL and ESTALARA_SMOKE_API_KEY already are). Until it is,
# every run enters the soft-skip path and this canary proves nothing. It is deliberately NOT
# in .github/required-checks.txt for that reason — a registered gate that only ever skips is
# worse than no gate, because it reads as coverage. Add it to the register in the same PR
# that provisions the secret.

on:
  push:
    branches:
      - main
      - "qa-engineer/**"
      - "backend-engineer/**"
      - "ml-engineer/**"
  pull_request:
    branches:
      - main
  schedule:
    # Nightly at 04:20 UTC — offset from the 04:00 intent-weights smoke so a shared upstream
    # outage produces two distinguishable failures rather than one indistinguishable minute.
    - cron: "20 4 * * *"
  workflow_dispatch:

# FOLLOW-1064 — never two canary requests at once.
#
# `push` (worker-branch prefixes above) and `pull_request` both fire for the same head, in the same
# second. Each run sends production ONE `POST /api/adapt`; two at once on the same Fluid instance is
# the condition under which every stall on record occurred ([MP-014] addendum: 170–182 s at
# `concurrency: 2`, while the same instance at `concurrency: 1` answered in ~2 s). This group keys on
# the HEAD sha — `github.sha` is the synthetic merge commit on `pull_request`, so it would never
# collide with the push run's sha and the group would group nothing.
#
# `cancel-in-progress: false` is deliberate: the second run QUEUES behind the first instead of
# killing it. Cancelling would leave a `cancelled` check-run of a REQUIRED name on the head
# (`.github/required-checks.txt`, ESC-062 step 2), which `scripts/gh-pr-checks-verified.sh` treats as
# not green (FOLLOW-918). The same applies to skipping the job. So the honest shape is: two runs per
# worker-branch head, serialized, both expected SUCCESS — never simultaneous. The triggers themselves
# are untouched (FOLLOW-1052 / FOLLOW-105: a worker branch without an open PR must still get CI).
concurrency:
  group: adapt-llm-source-canary-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  adapt-llm-source-smoke:
    name: Adapt LLM-source canary (source != playbook_fallback_llm_unavailable)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check secret availability
        id: secret-check
        env:
          ESTALARA_SMOKE_API_KEY: ${{ secrets.ESTALARA_SMOKE_API_KEY }}
          ESTALARA_SMOKE_TENANT_ID: ${{ secrets.ESTALARA_SMOKE_TENANT_ID }}
        run: |
          if [ -z "${ESTALARA_SMOKE_API_KEY}" ] || [ -z "${ESTALARA_SMOKE_TENANT_ID}" ]; then
            echo "::notice::ESTALARA_SMOKE_API_KEY or ESTALARA_SMOKE_TENANT_ID is not set — the FOLLOW-1022 adapt LLM-source canary will soft-skip. Provision per ESC-062 to enable live assertions."
            echo "secrets_present=false" >> "$GITHUB_OUTPUT"
          else
            echo "secrets_present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the adapt LLM-source canary
        working-directory: tests/integration
        env:
          ESTALARA_SMOKE_DECISION_API_URL: ${{ secrets.ESTALARA_SMOKE_DECISION_API_URL }}
          ESTALARA_SMOKE_API_KEY: ${{ secrets.ESTALARA_SMOKE_API_KEY }}
          ESTALARA_SMOKE_TENANT_ID: ${{ secrets.ESTALARA_SMOKE_TENANT_ID }}
          ESTALARA_SMOKE_LISTING_ID: ${{ secrets.ESTALARA_SMOKE_LISTING_ID }}
          REQUIRE_LIVE_ADAPT_SMOKE: ${{ steps.secret-check.outputs.secrets_present == 'true' && '1' || '' }}
        run: pnpm exec vitest run --config vitest.config.ts adapt-llm-source-live.smoke.test.ts

      # Scheduled runs are the ones nobody watches interactively — a nightly failure reaches a
      # human only if something carries it. [FOLLOW-986 / ESC-058]
      - name: Announce a scheduled failure (Slack if configured, annotation always)
        if: failure() && github.event_name == 'schedule'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_E2E_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sS -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\"🚨 NIGHTLY FAILED — ${{ github.workflow }} — production /api/adapt may be serving templates instead of generated copy — <$RUN_URL|view run>\"}" \
              && echo "Slack notified."
          else
            echo "::error title=Scheduled run failed with NO notification channel::\
          SLACK_E2E_WEBHOOK_URL is not set, so this failure reached no human by any channel. \
          See $RUN_URL — and backlog/ESCALATIONS.md ESC-058."
          fi
