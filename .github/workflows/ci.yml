name: CI

on:
  push:
    branches:
      - main
      - "devops-engineer/**"
      - "backend-engineer/**"
      - "sdk-engineer/**"
      - "data-engineer/**"
      - "ml-engineer/**"
      - "qa-engineer/**"
      - "compliance-engineer/**"
      - "architect/**"
      - "pm-orchestrator/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Doppler service token verification ──────────────────────────────────
  # Verifies that DOPPLER_TOKEN_DEV is provisioned and authenticates to Doppler.
  # Secret scope: `dev` config only. Production token is NOT in repo
  # (CORRECTED 2026-08-07, FOLLOW-878 / ESC-052: this line said "dev + staging
  # configs only". There is no staging config worth naming — Doppler `stg` was
  # byte-identical to `prd`, i.e. "staging scope" meant PRODUCTION scope. `stg` is
  # retired by FOLLOW-873.)
  # secrets — it lives in the Vercel-only path.
  #
  # Soft-degradation contract (forked PRs / token not yet provisioned):
  #   If DOPPLER_TOKEN_DEV is absent, the job logs a clear message and exits 0.
  #   It does NOT fail — external contributors should not be blocked on an
  #   internal secrets gate.
  #
  # When DOPPLER_TOKEN_DEV IS provisioned, this job MUST pass (exit 0) for CI
  # to be considered fully green. It is the signal that Doppler CI hygiene is
  # operational and downstream jobs (FOLLOW-063, FOLLOW-068, FOLLOW-039) can
  # use `doppler run --` to inject secrets.
  #
  # ESCALATION: DOPPLER_TOKEN_DEV secret provisioning is tracked in
  # backlog/ESCALATIONS.md. Add it at: GitHub repo → Settings → Secrets and
  # variables → Actions → New repository secret.
  #   Name:  DOPPLER_TOKEN_DEV
  #   Value: Doppler service token scoped to project=estalara, config=dev
  #          (create at: https://dashboard.doppler.com → project → Access → Service Tokens)
  doppler-verify:
    name: Doppler verify
    runs-on: ubuntu-latest
    # Non-blocking — forked PRs and repos without the secret still pass CI.
    # When the secret IS present, a failed auth means real misconfiguration.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Check token presence and verify Doppler auth
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_DEV }}
        run: |
          if [ -z "${DOPPLER_TOKEN}" ]; then
            echo "::notice::DOPPLER_TOKEN_DEV is not set — skipping Doppler auth verification."
            echo "This is expected for forked PRs and environments where the secret has not yet"
            echo "been provisioned. See backlog/ESCALATIONS.md for provisioning instructions."
            echo "Once DOPPLER_TOKEN_DEV is added to repo secrets, this step will authenticate"
            echo "and confirm the CI Doppler integration is fully operational."
            exit 0
          fi
          echo "DOPPLER_TOKEN_DEV is present — verifying auth..."
          doppler me
          echo "Doppler auth verified. CI can now use 'doppler run --' to inject secrets."

  # ── Static checks (parallel, ~3min) ─────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @estalara/shared build

      - name: Lint
        run: pnpm turbo run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies first
        run: pnpm turbo run build --filter='!@estalara/control-plane' --filter='./packages/*'

      - name: Typecheck
        run: pnpm turbo run typecheck

  # ── Rule I hard gate: all exported symbols must have non-test importers ──
  rule-i:
    name: Rule I — wired-or-dead check
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Rule I — wired-or-dead check
        run: bash scripts/check-rule-i.sh

  # ── Rule I gate self-test (FOLLOW-842) ──────────────────────────────────────
  # WHY THIS IS A SEPARATE JOB, not a step of `rule-i` above. `rule-i` is the
  # repo's one documented pre-existing-red gate: it has been failing on ~192
  # legacy violations for months, so a step added to it would be red on every
  # run and nobody would ever read it. This job must be GREEN, so a regression
  # in the gate's own guards is visible the moment it lands.
  #
  # WHAT IT PROTECTS. check-rule-i.sh extracts every symbol with `grep -oP`
  # under `set -uo pipefail` WITHOUT `-e`. On a host without PCRE grep the
  # extraction returned nothing and the gate printed "Violations found: 0" /
  # "Rule I passed" / exit 0 — the same fail-open FOLLOW-830 closed in
  # gh-pr-checks-verified.sh, which now parses THIS script's WARN lines to build
  # the baseline every PR is classified against. Two fail-opens in series.
  #
  # The self-test is hermetic and offline: each fixture builds a throwaway git
  # repo in a temp dir, so nothing here depends on the real repo's violation
  # count. ubuntu-latest has bash 5 and GNU grep, so the degraded matcher is
  # simulated with a PATH shim rather than needing a BSD runner.
  #
  # Hard gate — no continue-on-error.
  rule-i-gate-self-test:
    name: Rule I gate self-test (FOLLOW-842)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the Rule I gate self-test (validates the gate itself)
        run: bash scripts/check-rule-i.sh --self-test

  # ── Unit / smoke tests ───────────────────────────────────────────────────
  test-node:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    strategy:
      matrix:
        node-version: ["22"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo run build --filter='./packages/*'

      - name: Run tests
        # FOLLOW-1065: `@estalara/integration-smoke` (tests/integration) was in none of these filters, so
        # its two offline specs (adapt-canary-verdict, archetype-id-parity) had zero executions. The
        # three live smoke specs in the same package self-skip without secrets (HAS_SECRETS / skipIf) —
        # they must report `skipped` here, never `passed`.
        run: pnpm turbo run test --filter='./packages/*' --filter='@estalara/ingest' --filter='@estalara/decision-api' --filter='@estalara/control-plane' --filter='@estalara/integration-smoke'

  test-python:
    name: Test (Python)
    runs-on: ubuntu-latest
    strategy:
      # Independent jobs — one app's failure must not cancel the others (a non-existent
      # matrix entry previously cancelled every sibling via fail-fast, masking which app
      # actually failed).
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        # Only the four Python apps that actually exist under apps/ (each has a pyproject.toml).
        # adaptation-engine / archetype-pipeline / auto-detect were deleted in da9f45f
        # ("delete 3 Modal placeholder app stubs" [TICKET-ARCH-103]) but left in this matrix,
        # so their jobs failed on a missing working-directory and red-lined Python CI ever since.
        app:
          - intent-engine
          - llm-gateway
          - stream-consumer
          - data-quality
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest src/ -v

  # ── Build ────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all TypeScript packages
        run: pnpm turbo run build --filter='./packages/*' --filter='@estalara/ingest' --filter='@estalara/decision-api'

      - name: SDK bundle size gate (<42KB gzip, ESC-028)
        run: pnpm --filter=@estalara/sdk build:check

  # ── Control-plane build (Next.js, separate job — takes longer) ───────────
  build-control-plane:
    name: Build (control-plane)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build control-plane
        run: pnpm turbo run build --filter='@estalara/control-plane'

  # ── Format check ─────────────────────────────────────────────────────────
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec prettier --check .

  # ── Security: Gitleaks scan ──────────────────────────────────────────────
  gitleaks-scan:
    name: Gitleaks secrets scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for comprehensive scan

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  # ── ClickHouse migrations smoke test ─────────────────────────────────────
  clickhouse-smoke:
    name: ClickHouse migrations smoke
    runs-on: ubuntu-latest
    services:
      clickhouse:
        # Pinned (FOLLOW-620): `latest` moved to 26.7 on 2026-07-22 and its new
        # strict check (dimension columns outside the AggregatingMergeTree
        # sorting key → Code 36 BAD_ARGUMENTS on 0002_create_session_summary_mv)
        # broke every PR. 25.8 is the last LTS the migration chain is proven on.
        # 26.x compatibility of migration 0002 is FOLLOW-621 (data-engineer).
        image: clickhouse/clickhouse-server:25.8
        ports:
          - 8123:8123
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: clickhouse
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apps/ingest's logger imports `@estalara/shared/observability`, which
      # resolves to the built dist. Without this the ingest specs fail to collect.
      - name: Build shared package
        run: pnpm --filter @estalara/shared build

      - name: Wait for ClickHouse
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8123/ping && break
            echo "  waiting... ($i/30)"
            sleep 3
          done
          curl -sf http://localhost:8123/ping

      - name: Migration-ordering contract test (FOLLOW-394)
        env:
          CLICKHOUSE_PASSWORD: clickhouse
        run: |
          LOCAL=1 CLICKHOUSE_URL=http://localhost:8123 \
            ./infra/clickhouse/scripts/migration-contract-test.sh

      - name: Apply migrations (LOCAL=1 → MergeTree)
        env:
          CLICKHOUSE_PASSWORD: clickhouse
        run: |
          LOCAL=1 CLICKHOUSE_URL=http://localhost:8123 \
            ./infra/clickhouse/scripts/migrate.sh

      - name: Run smoke test
        env:
          CLICKHOUSE_PASSWORD: clickhouse
        run: |
          LOCAL=1 CLICKHOUSE_URL=http://localhost:8123 \
            ./infra/clickhouse/scripts/smoke-test.sh

      - name: TTL golden-DDL regression test (FOLLOW-535)
        env:
          CLICKHOUSE_PASSWORD: clickhouse
        run: |
          LOCAL=1 CLICKHOUSE_URL=http://localhost:8123 \
            ./infra/clickhouse/scripts/ttl-golden-test.sh

      # ── FOLLOW-853: the ingest Worker's events write path, against a real engine ──
      # Nothing exercised `pushToClickHouse` against a ClickHouse before this step:
      # the unit suite mocks fetch, the smoke script above sends the WRITER's bytes
      # only since FOLLOW-853, and e2e-smoke.yml starts wrangler without
      # CLICKHOUSE_URL so the producer's no-creds guard fires. The producer emitted
      # trailing-`Z` ISO-8601, which this container's default
      # `date_time_input_format=basic` rejects with Code 27 — post-ACK, so the SDK
      # still saw HTTP 200 while the whole batch was discarded.
      #
      # REQUIRE_CLICKHOUSE=1 makes the spec HARD-FAIL rather than skip if the
      # container is absent or unreachable (Rule Q — a suite that silently skipped
      # this file is the exact failure mode it exists to prevent).
      - name: Ingest producer live-ClickHouse guard (FOLLOW-853 AC(2))
        env:
          CLICKHOUSE_URL: http://localhost:8123
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: clickhouse
          REQUIRE_CLICKHOUSE: "1"
        working-directory: apps/ingest
        run: |
          pnpm exec vitest run --config vitest.integration.config.ts \
            src/__tests__/integration/clickhouse-producer.integration.test.ts

  # ── Tracer query-builders live ClickHouse guard (FOLLOW-316) ────────────
  # Submits each K.3.6 tracer builder against a real ClickHouse engine so a
  # query-analysis error (Code 386 NO_COMMON_TYPE — the class fixed by
  # FOLLOW-315) fails CI rather than slipping through mock-only unit coverage.
  # AC3: REQUIRE_CLICKHOUSE=1 makes the spec hard-fail if the container is
  # absent (no silent skip).
  tracer-query-smoke:
    name: Tracer query-builders live ClickHouse guard
    runs-on: ubuntu-latest
    services:
      clickhouse:
        # Pinned (FOLLOW-620) — same reason as clickhouse-smoke above: keep
        # both CH service containers on the same proven LTS.
        image: clickhouse/clickhouse-server:25.8
        ports:
          - 8123:8123
        env:
          # Skip user-setup so the default user has no password (same as local
          # dev — FOLLOW-315 verification used this flag). The tracer client
          # (clickhouse-tracer.ts authHeaders) sends no Authorization header
          # when CLICKHOUSE_PASSWORD is empty, which matches a passwordless CH.
          CLICKHOUSE_SKIP_USER_SETUP: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @estalara/shared build

      - name: Wait for ClickHouse
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8123/ping && break
            echo "  waiting... ($i/30)"
            sleep 3
          done
          curl -sf http://localhost:8123/ping

      - name: Apply migrations (LOCAL=1 → MergeTree, passwordless)
        run: |
          LOCAL=1 CLICKHOUSE_URL=http://localhost:8123 \
            ./infra/clickhouse/scripts/migrate.sh

      - name: Run tracer integration tests (AC1 happy-path + AC2 negative control)
        env:
          CLICKHOUSE_URL: http://localhost:8123
          CLICKHOUSE_PASSWORD: ""
          REQUIRE_CLICKHOUSE: "1"
        # Scope vitest to the tracer file only. The DSR integration spec
        # (clickhouse-dsr.integration.test.ts) has known latent failures tracked
        # by FOLLOW-317; running it here would produce false negatives. When
        # FOLLOW-317 lands, add its file path alongside this one.
        working-directory: apps/control-plane
        run: |
          pnpm exec vitest run --config vitest.integration.config.ts \
            src/__tests__/integration/clickhouse-tracer.integration.test.ts

      # ── FOLLOW-1118: the consent-log retention cron, against a real engine ──
      # ESC-071 was a promise with no mechanism. A mocked test can assert we SENT a DELETE; only a
      # live engine can assert a row LEFT the table — and, just as importantly, that a same-age
      # NON-consent row did not (the 13-month `events` TTL owns every other type). The spec also
      # reproduces the pre-fix state, in which both rows survive.
      #
      # REQUIRE_CLICKHOUSE=1 makes it hard-fail rather than skip if the container is unreachable
      # (Rule Q — a silently skipped retention proof is the failure mode it exists to prevent).
      - name: Consent-log retention live-ClickHouse guard (FOLLOW-1118)
        env:
          CLICKHOUSE_URL: http://localhost:8123
          CLICKHOUSE_PASSWORD: ""
          REQUIRE_CLICKHOUSE: "1"
        working-directory: apps/control-plane
        run: |
          pnpm exec vitest run --config vitest.integration.config.ts \
            src/__tests__/integration/consent-log-retention.integration.test.ts

  # ── Auto-Detection corpus gate (TICKET-AUTO-005) ─────────────────────────
  # Runs detectSiteSchema against 24 synthetic platform fixtures and asserts
  # pooled precision >= 95% and recall >= 80%. Uploads corpus-report.json as a
  # build artifact so reviewers can inspect per-platform metrics.
  corpus-gate:
    name: Auto-Detection corpus gate
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @estalara/shared build

      - name: Run corpus CI gate
        run: pnpm --filter @estalara/sdk test:corpus

      - name: Upload corpus report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-report
          path: packages/sdk/corpus-report.json
          retention-days: 14

  # ── Served SDK bundles must be built, never committed (ESC-047) ───────────
  # public/sdk.js froze on 2026-05-29 while ~76 SDK tickets merged behind it —
  # all green, all DONE, none reaching a tenant. A committed binary is
  # indistinguishable from a fresh one, so this gate removes the possibility
  # rather than trying to detect staleness. Hard gate — no continue-on-error.
  served-bundles:
    name: Served SDK bundles build-generated (ESC-047)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run served-bundle check
        run: bash scripts/check-served-bundles.sh

  # ── Rule H hard gate: schema scaffolds must have runtime consumers ────────
  rule-h:
    name: Rule H — schema scaffold wiring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch for diff
        run: git fetch origin main --depth=50

      - name: Run Rule H check
        run: bash scripts/check-rule-h.sh origin/main

  # ── Rule H gate self-test (FOLLOW-857) ──────────────────────────────────────
  # WHY THIS IS A SEPARATE JOB. The `rule-h` job above only inspects files the
  # PR's own diff ADDS (`--diff-filter=A base...HEAD`), so on the overwhelming
  # majority of PRs — including the one that fixed this — Pattern 2 evaluates
  # zero symbols and the job is green without having exercised a single line of
  # the code under test. A green `rule-h` is therefore NOT evidence the gate
  # works. This job is that evidence, and it must be GREEN on every PR.
  #
  # WHAT IT PROTECTS. Pattern 2's consumer count was built by a pipeline ending
  # `| wc -l || echo 0`. Under `set -euo pipefail`, when a symbol had ZERO
  # non-test importers — the exact condition the gate exists to catch — the
  # trailing `grep -v` exited 1, pipefail carried that past `wc -l`'s own "0",
  # and `|| echo 0` appended a SECOND "0". `[[ "0\n0" -lt 1 ]]` is an arithmetic
  # syntax error, which inside an `if` reads as false, so the hard gate printed
  # `OK: ... importer(s).` over a genuine orphan export and exited 0 — for 84
  # days, from 0a0a6880 (2026-05-14) to this fix. The gate's green was
  # anti-correlated with the truth on the only pattern it uniquely covers.
  #
  # SHARED FIXTURES. The first two fixtures come from
  # scripts/lib/wired-or-dead-common.sh and are run against BOTH gates — here
  # and in `rule-i-gate-self-test`. The pair diverged precisely because nothing
  # compared them: check-rule-i.sh got the equivalent hardening three days after
  # check-rule-h.sh shipped without it. If either gate stops failing on an
  # orphan lib export, both self-tests go red.
  #
  # Hermetic and offline: every fixture builds a throwaway git repo in a temp
  # dir, so nothing here depends on this repo's own state.
  #
  # Hard gate — no continue-on-error.
  rule-h-gate-self-test:
    name: Rule H gate self-test (FOLLOW-857)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the Rule H gate self-test (validates the gate itself)
        run: bash scripts/check-rule-h.sh --self-test

  # ── Staff-write audit atomicity hard gate (ADR-0018 §3a / FOLLOW-607) ────
  # Every staff-audited WRITE (data mutation + staff_audit_log insert) must
  # commit both in ONE db.transaction() — stops FOLLOW-596/597/598 (and any
  # future staff-write port) from regressing to the pre-605 mutate-then-audit
  # shape. Hard gate — no continue-on-error.
  staff-write-atomicity:
    name: Staff-write audit atomicity (ADR-0018 §3a / FOLLOW-607)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run staff-write atomicity check
        run: bash scripts/check-staff-write-atomicity.sh

      - name: Run red-first fixture proof
        run: bash scripts/__tests__/check-staff-write-atomicity.test.sh

  # ── Rule J hard gate: mirror-code pairs must stay in sync ───────────────
  # FOLLOW-1070: the P2 (signature) check now shells out to
  # scripts/lib/extract-fn-signature.cjs, which requires the `typescript`
  # package (parses full declarations instead of one grep line — see that
  # script's header). This job did not install deps before; it now does,
  # matching the pattern already used by staff-write-atomicity (another
  # `require('typescript')` gate, ci.yml:604-612).
  rule-j:
    name: Rule J — mirror-code sync check
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the FOLLOW-1070 fixture test (assertions 2a/2b/2c)
      # reads apps/control-plane/src/app/api/adapt/route.ts as it stood at
      # `b12a653f^` (the commit before PR #825 merged) via `git show`. The
      # default shallow checkout (depth 1) does not have that commit, so
      # `git show` fails and those assertions cannot run at all — a
      # different failure mode from the mismatch they exist to prove.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check mirror-file byte identity
        run: bash scripts/check-mirror-files.sh

      # if: always() — this must still prove itself even on a run where the
      # gate above is expected to (correctly) fail, e.g. while the pre-existing
      # #825 divergence (ESC-068) is open. Otherwise the fixture's own "it
      # runs" evidence would be silently gated behind the very check it's
      # proving the mechanics of.
      - name: Run red-first fixture proof (FOLLOW-1070 multi-line signature extraction)
        if: always()
        run: bash scripts/__tests__/check-mirror-signature-extraction.test.sh

  # ── Privacy Notice key-sync gate (FOLLOW-230 / Rule N) ──────────────────
  # Asserts that every *_STORAGE_KEY, *_KEY_PREFIX, and *_DISMISS_KEY constant
  # in packages/sdk/src (non-test files) is disclosed in the Privacy Notice
  # template (docs/compliance/PRIVACY_NOTICE_TEMPLATE.md §4).
  #
  # A key present in shipped SDK code but absent from the privacy notice is a
  # Rule N compliance gap: a disclosure-by-omission that makes the notice
  # factually incomplete for EU/UK data subjects (RETRO-036 CB-1).
  #
  # Hard gate — no continue-on-error.
  privacy-notice-keys-sync:
    name: Privacy Notice SDK key-sync (Rule N / FOLLOW-230)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert all SDK storage keys are disclosed in Privacy Notice §4
        run: bash scripts/check-privacy-notice-keys.sh

  # ── Registration consent-text sync gate (FOLLOW-705 / Rule N / Rule AH) ────
  # Asserts that the published registration-consent disclosure
  # (docs/compliance/PRIVACY_NOTICE_TEMPLATE.md §6.1, between the CANONICAL
  # CONSENT TEXT sentinels) normalizes byte-for-byte — per the §6.1.1 N1–N8
  # spec — to the string the server actually serves the data subject,
  # renderPlatformConsentText() in the consent/platform-registration route.
  #
  # A doc that differs from the served text is a false statement about what the
  # data subject agreed to (GDPR Art. 7(1) demonstrability). Before FOLLOW-705
  # they DID differ — the doc carried two unfilled `[bracket]` slots the renderer
  # never emitted — and the lib.ts "SYNC: byte-aligned" comment asserting
  # otherwise had nothing enforcing it (RETRO-227).
  #
  # Hard gate — no continue-on-error.
  consent-text-sync:
    name: Registration consent-text sync (Rule N / FOLLOW-705)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Self-test the gate (proves it detects drift)
        run: node scripts/check-consent-text-sync.mjs --self-test

      - name: Assert Privacy Notice §6.1 == served consent text
        run: node scripts/check-consent-text-sync.mjs

  # ── Consent contract drift gate (FOLLOW-716) ───────────────────────────────
  # Asserts that the HTTP status codes and `code` string literals
  # GET/POST /api/v1/consent/platform-registration can actually emit (derived
  # from route.ts) match the caller-facing contract documented in
  # backlog/HANDOFFS.md's FOLLOW-374 section (the MACHINE-CHECKED CONTRACT
  # blocks), checked separately per method.
  #
  # Four consecutive retros (RETRO-226 → 227 → 228 → 229) independently found
  # the same gap: the only consumer of this contract, app.estalara.com, is out
  # of this repo, its only spec was unlinked English prose, and nothing caught
  # a PR that changed the route's emittable status/code set without updating
  # the doc. Same pattern as consent-text-sync (FOLLOW-705) applied to the
  # contract rather than the rendered text.
  #
  # Hard gate — no continue-on-error.
  consent-contract-sync:
    name: Consent contract drift gate (FOLLOW-716)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Self-test the gate (proves it detects drift, both directions, per method)
        run: node scripts/check-consent-contract-sync.mjs --self-test

      - name: Assert route.ts status/code contract == HANDOFFS.md FOLLOW-374 spec
        run: node scripts/check-consent-contract-sync.mjs

  # ── Consent retention sync (FOLLOW-1118 / ESC-071) ──────────────────────────
  # Fails when the declared consent-log retention constant, the disclosure sentence rendered to
  # visitors in en/pl/es, and the retention cron's deletion window disagree.
  #
  # ESC-071: the shipped banner promised, in three languages, that the consent-decision log was
  # deleted after 7 days, while the only mechanism kept it for 13 months — a false statement to
  # data subjects that stood for three months because the period lived in four places with nothing
  # comparing them. FOLLOW-1118 made CONSENT_LOG_RETENTION_DAYS the single declared value and
  # derived both the text and the deletion from it. WITHOUT THIS JOB that work would have MOVED
  # the drift rather than removed it, which is the whole point of the ticket.
  #
  # The gate imports packages/shared/src/consent-retention.ts and calls the real renderer and SQL
  # builder (Node type-stripping; that module has zero imports, so no build step is needed), so
  # the number it checks is the one the cron will actually send.
  #
  # Hard gate — no continue-on-error.
  consent-retention-sync:
    name: Consent retention sync (FOLLOW-1118)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Self-test the gate (proves it catches each drift, red-first)
        run: node --experimental-strip-types scripts/check-consent-retention-sync.mjs --self-test

      - name: Assert constant == rendered disclosure == cron deletion window
        run: node --experimental-strip-types scripts/check-consent-retention-sync.mjs

  # ── ADR-0021 §D5 binding conditions (FOLLOW-925) ────────────────────────────
  # The compliance countersign of ADR-0021 (PR #703) was GRANTED WITH BINDING
  # CONDITIONS, and the conditions are the substance of it: byte-identical
  # carriage of the DPIA §13.1/§13.2 mandated disclosure sentences in every
  # locale, the §D3 identifier-free request shape, and Rule N cross-references
  # in dpia.md. They "gate the FOLLOW-915 implementation PR" — and nothing
  # checked them. RETRO-263 found the same shape independently (FOLLOW-923).
  #
  # The gate ARMS on the presence of any FOLLOW-915 artifact rather than passing
  # while they are absent, because "green because the thing is not built yet" is
  # the FOLLOW-918 defect wearing this control's name. Condition 1 is enforced in
  # both states: the mandated sentences must always have a live home.
  #
  # Hard gate — no continue-on-error.
  adr-0021-conditions:
    name: ADR-0021 §D5 binding conditions (FOLLOW-925)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Self-test the gate (proves it catches each condition, red-first)
        run: node scripts/check-adr-0021-conditions.mjs --self-test

      - name: Assert the ADR-0021 §D5 binding conditions hold
        run: node scripts/check-adr-0021-conditions.mjs

  # ── Fire-and-forget sink guard (FOLLOW-433 / ESC-033) ──────────────────────
  # Asserts that no bare `void fn(` / `void (async` request-path sinks exist in
  # apps/control-plane/src (excluding *.test.ts).  These patterns are silently
  # dropped on Vercel instance suspension (ESC-033 mechanism); the correct pattern
  # is afterResponse() → next/server after().
  #
  # FOLLOW-431 AC-1 and FOLLOW-432 AC-1 both shipped FALSE ("verify by grep" over-
  # claimed twice). This dedicated CI job makes the AC self-enforcing.
  #
  # Hard gate — no continue-on-error.
  fire-and-forget-guard:
    name: Fire-and-forget sink guard (FOLLOW-433)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run FF sink self-test (validates the gate itself)
        run: bash scripts/check-fire-and-forget-sinks.sh --self-test

      - name: Assert no unwrapped fire-and-forget sinks
        run: bash scripts/check-fire-and-forget-sinks.sh

  # ── Rule K.2 consumer-side swallow guard (FOLLOW-625 / RETRO-205 §6 P-2) ────
  # Mechanises the consumer-side clause of CONVENTIONS_PATCH.md Rule K.2 (whose
  # Verification-block grep nothing ran): FAILS the build when a CLIENT component
  # under apps/control-plane/src/{app,components}/** GETs its editable config on a
  # fetch(...) chain, populates form state, and SWALLOWS a failed load (empty /
  # comment-only / log-only / no-op .catch) — the "swallow a failed GET then Save
  # DEFAULTS over real config" data-loss class that shipped FOUR times
  # (FOLLOW-595 → 596 → 600, then the twins fixed in FOLLOW-630) and was caught
  # only by retros. The scope covers src/components/** (not just src/app/**) per
  # the RETRO-206 §4a LG-2 amendment — the twin FOLLOW-624 missed lived there.
  #
  # A TypeScript-AST walk (typescript is already a repo devDependency) — see
  # scripts/check-k2-consumer-swallow.cjs for the COVERED vs DOCUMENTED-RESIDUAL
  # call-shapes (Rule AE) and the annotated allow-list. Hard gate — no
  # continue-on-error.
  k2-consumer-swallow-guard:
    name: Rule K.2 consumer-side swallow guard (FOLLOW-625)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run red-first fixture proof (validates the gate BOTH directions)
        run: bash scripts/__tests__/check-k2-consumer-swallow.test.sh

      - name: Assert no consumer-side config-load swallows
        run: bash scripts/check-k2-consumer-swallow.sh

  # ── Modal App singleton guard (FOLLOW-438 / RETRO-143 / ESC-034) ───────────
  # Asserts that exactly one real modal.App() instantiation exists in
  # apps/llm-gateway/src (the shared instance in jobs/_app.py).
  #
  # BUG 2 (ESC-034): two consumer files each declared their own
  # modal.App("estalara-description-generator"); deploying either alone silently
  # wiped the other's functions from the live Modal app.  FOLLOW-437 (PR #393)
  # fixed this with a shared _app.py; this guard prevents silent recurrence.
  #
  # Hard gate — no continue-on-error.
  modal-app-singleton-guard:
    name: Modal App singleton guard (FOLLOW-438)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Modal App self-test (validates the gate itself)
        run: bash scripts/check-modal-app-singleton.sh --self-test

      - name: Assert exactly one modal.App() instantiation in llm-gateway
        run: bash scripts/check-modal-app-singleton.sh

  # ── Modal local-source gate (FOLLOW-900) ───────────────────────────────────
  # `modal deploy` only REGISTERS functions — it never starts a container, so it
  # cannot fail on an image that cannot be imported. That is not hypothetical:
  # estalara-schema-validation deployed green, listed `deployed`, held a registered
  # cron, and every container died at `from crons.observability import ...` before
  # Sentry was initialised, so the nightly job was dead for its entire life with no
  # signal anywhere. This gate asserts statically that every LOCAL module a deployed
  # Modal app imports (at any nesting depth, function bodies included) is declared on
  # that app's image via add_local_python_source.
  #
  # HARD GATE. No continue-on-error, no secret dependency, therefore no soft-skip.
  # The self-test runs FIRST so a broken detector cannot pass the gate (Rule Q).
  modal-local-imports-guard:
    name: Modal local-source gate (FOLLOW-900)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run local-source self-test (validates the gate itself)
        run: python3 scripts/check-modal-local-imports.py --self-test

      - name: Assert every deployed Modal app declares the local modules it imports
        run: python3 scripts/check-modal-local-imports.py

  # ── Staging-plane gate (FOLLOW-878 / ESC-052 RESOLVED, CEO option 2) ────────
  # ESC-052 established that Estalara has NO staging environment: Doppler
  # `stg.DATABASE_URL_ADMIN` is byte-identical to `prd` (a write to `stg` is a write
  # to PRODUCTION), Doppler `stg` carries no CLICKHOUSE_*, and both
  # `*-staging.estalara.com` hostnames have no DNS record. The ruling's operative
  # sentence — "nothing may continue to APPEAR to provide isolation it does not
  # provide" — cannot be enforced by prose, so this gate enforces it mechanically
  # against a register of the exact surviving references.
  #
  # HARD GATE. No `continue-on-error`, no secret dependency, therefore no soft-skip:
  # it runs on every push to an agent branch and every PR, always against the real
  # tree. The self-test runs FIRST so a broken detector cannot pass the gate.
  staging-plane-guard:
    name: Staging-plane gate (FOLLOW-878 / ESC-052)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run staging-plane self-test (validates the gate itself)
        run: bash scripts/check-no-staging-plane.sh --self-test

      - name: Assert the staging-plane reference set matches the register
        run: bash scripts/check-no-staging-plane.sh

  # ── Sentry init singleton guard (FOLLOW-738 / ESC-045 item 4) ───────────────
  # Asserts that every sentry_sdk.init( call site across the Python Modal apps
  # lives inside the shared hardened observability.py helper (or one of its
  # Rule J mirrors), never a bare re-introduced call. See
  # scripts/check-sentry-init-singleton.sh for the full ESC-045 rationale.
  #
  # Hard gate — no continue-on-error.
  sentry-init-singleton-guard:
    name: Sentry init singleton guard (FOLLOW-738)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Sentry init self-test (validates the gate itself)
        run: bash scripts/check-sentry-init-singleton.sh --self-test

      - name: Assert zero sentry_sdk.init( call sites outside observability.py
        run: bash scripts/check-sentry-init-singleton.sh

  # ── PR-checks gate self-test (FOLLOW-830 / FOLLOW-827) ──────────────────────
  # WHY THIS EXISTS. scripts/gh-pr-checks-verified.sh is the mandated
  # pre-READY_FOR_REVIEW merge gate for every ticket in this repo (CLAUDE.md,
  # CONVENTIONS_PATCH.md Rule A, four agent definitions) and it shipped with
  # ZERO tests. Two false-green paths reached main as a direct result: a Rule I
  # classification by COUNT that accepted a compensating symbol swap
  # (FOLLOW-827), and an unguarded `grep -oP` under `set -uo pipefail` without
  # `-e` that printed "all checks green" and exited 0 on any host without PCRE
  # grep (FOLLOW-830). A gate nothing tests is a gate nobody can trust to fail.
  #
  # The self-test is hermetic and offline: synthesized fixtures only (Rule AM),
  # no live PR check state, no gh token needed. It runs on ubuntu-latest, which
  # has both bash 5 and GNU grep, so the no-PCRE fixture simulates the degraded
  # matcher with a PATH shim rather than needing a BSD runner.
  #
  # Hard gate — no continue-on-error. If the gate that validates every PR is
  # itself broken, that is exactly when this must go red.
  # ── Registers that were prose until FOLLOW-945 ──────────────────────────────
  # Rule AP: "a gate's known-residual-gaps list MUST be a MACHINE-CHECKED register
  # the gate itself executes, not prose." Both registers below were prose. A grep
  # for DEPLOYMENT_SURFACES / MERGED_NOT_DEPLOYED across scripts, .github, docs and
  # backlog returned exactly ONE line — check-gate-exit-codes.sh:79 — and it was
  # there to record that it does NOT route on them.
  #
  # Two jobs, not two steps in one job, because .github/required-checks.txt keys on
  # the check NAME: a step failure inside a shared job is invisible to the identity
  # axis that register exists to provide (FOLLOW-918).
  #
  # Hard gates — no continue-on-error.
  deployment-surface-register:
    name: Deployment-surface register vs repo (FOLLOW-945)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every apps/* surface is registered AND its merge-trigger claim matches the workflows
        run: node scripts/check-deployment-surfaces.mjs

  ticket-status-vocabulary:
    name: Ticket status vocabulary (FOLLOW-945)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every ticket status is a word docs/TICKET_FORMAT.md defines
        run: node scripts/check-ticket-status-vocabulary.mjs

  # ── Measured premises — FOLLOW-952 (answers the dropped FOLLOW-946 AC(4)) ───
  # A claim about a live environment (a prod row count, whether a Vercel env var
  # is set) cannot be verified from this repo's contents, and until this gate two
  # of them lived in shipped source comments with no owner, no expiry and no
  # reader.
  #
  # This gate CANNOT re-measure anything — CI has no read path to prod Postgres,
  # Vercel or Cloudflare, and the script says so in its own success output. It
  # enforces the only thing a repo-side control can: every premise registered,
  # dated, cited, and not past its revalidation date. Green here is bookkeeping,
  # never evidence that a premise still holds.
  #
  # Its own job, not a step in a shared one, because .github/required-checks.txt
  # keys on the check NAME (FOLLOW-918).
  #
  # Hard gate — no continue-on-error. An expired premise is exactly when someone
  # must be stopped.
  measured-premises:
    name: Measured-premise register (FOLLOW-952)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The gate's own failure mode is SILENCE — a detector that matches nothing passes, and a
      # dropped register entry reports as a citation problem. FOLLOW-982 found both: assertion 5
      # matched ZERO lines in its own scope on the day it shipped. Self-test first, so a drifted
      # detector fails HERE rather than by quietly waving everything through. [FOLLOW-982]
      - name: Self-test the detector and the parse guard
        run: node scripts/check-measured-premises.mjs --self-test

      - name: Every measured premise is registered, dated, cited and unexpired
        run: node scripts/check-measured-premises.mjs

  pr-checks-gate-self-test:
    name: PR-checks gate self-test (FOLLOW-830)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the PR-checks gate self-test (validates the merge gate itself)
        run: bash scripts/gh-pr-checks-verified.sh --self-test

      # ── the gate's exit-code contract vs the corpus that routes on it ───────
      # FOLLOW-854. PR #683 widened exit 3 and told readers not to increment
      # fix_iteration_counter on it. That reached docs/ and CONVENTIONS_PATCH.md
      # but NOT .claude/agents/pm-orchestrator.md — the file the decision-maker
      # actually executes, which went on saying "3 = usage/gh error" in the same
      # paragraph as the retry cap. Rule AI already ordered the tier-0 corpus
      # first and shipped the greps; nothing ran them. This step runs them.
      #
      # Hard gate — no continue-on-error.
      - name: Gate exit-code contract vs routing corpus (FOLLOW-854)
        run: bash scripts/check-gate-exit-codes.sh

  # ── Sentry capture-has-init guard (FOLLOW-743) ──────────────────────────────
  # The INVERSE of the guard above: asserts every capture_exception(/
  # capture_message( call site's module also contains an init_sentry( call (or
  # is explicitly allow-listed). Closes the blind spot check-sentry-init-
  # singleton.sh cannot see by construction — a module that never had an init
  # trivially has "zero bare init sites". See
  # scripts/check-sentry-capture-has-init.sh for the full FOLLOW-743 rationale.
  #
  # Hard gate — no continue-on-error.
  sentry-capture-has-init-guard:
    name: Sentry capture-has-init guard (FOLLOW-743)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Sentry capture-has-init self-test (validates the gate itself)
        run: bash scripts/check-sentry-capture-has-init.sh --self-test

      - name: Assert every capture call site has an init_sentry( in its module
        run: bash scripts/check-sentry-capture-has-init.sh

  # ── shellcheck for the Sentry gate family (FOLLOW-769 AC3/AC4) ─────────────
  # WHY THIS EXISTS. `# shellcheck source=lib/...` directives appear in five
  # places across the Sentry gates and their shared helpers, and NO shellcheck
  # ran anywhere in this repo — the directives read as evidence of a lint
  # control that did not exist (RETRO-239 §4d DG-1). FOLLOW-769 AC3 offered two
  # ways out: wire the job, or delete the directives. Wiring it is the option
  # that adds real coverage, and it is the only one available in practice —
  # scripts/check-mirror-files.sh carries a `# shellcheck disable=SC2064` this
  # PR must not touch, so "delete the directives" could not have been completed
  # anyway.
  #
  # `-x` follows sourced files and `-P SCRIPTDIR` resolves the `source=` paths
  # relative to the script, not the CWD — without BOTH, every source= directive
  # is an unresolved SC1091 and the directives stay decorative. Default
  # severity: info and style findings fail too, deliberately, because SC1091
  # (an unresolvable source= path) is itself info-level, and downgrading past it
  # would put this job straight back in the state it exists to fix.
  #
  # SCOPE (FOLLOW-769 AC4). Explicit file list, not scripts/**/*.sh: the rest of
  # scripts/ has pre-existing findings that are out of this ticket's scope, and
  # a job that starts red teaches nothing. Widening it repo-wide is filed as its
  # own ticket in backlog/FOLLOW_UPS.md. A file added to the Sentry gate family
  # must be added here in the same PR.
  #
  # Hard gate — no continue-on-error.
  shellcheck-sentry-gates:
    name: shellcheck (Sentry gate family, FOLLOW-769)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck --version (proof the linter really ran)
        run: shellcheck --version

      - name: Lint the Sentry gates and their shared helpers
        run: |
          shellcheck -x -P SCRIPTDIR \
            scripts/check-sentry-capture-has-init.sh \
            scripts/check-sentry-init-singleton.sh \
            scripts/lib/clean-python-source.sh \
            scripts/lib/suppression-baseline.sh

      # The merge gate and its corpus checker were shellcheck-clean only by the
      # author's own local run — no automated path linted them, which is the
      # "verified by a human once" shape this repo keeps finding (FOLLOW-854).
      - name: Lint the merge gate and its exit-code corpus checker
        run: |
          shellcheck scripts/gh-pr-checks-verified.sh scripts/check-gate-exit-codes.sh

      # FOLLOW-857 added scripts/lib/wired-or-dead-common.sh, a second sourced
      # helper carrying a `# shellcheck source=` directive, so -x -P SCRIPTDIR is
      # required here as it is for the Sentry family above. Linted in this job
      # rather than a new one: a new job name would have to be added to branch
      # protection before it was required, and an unrequired lint job is not a
      # control. The job's title still says "Sentry gate family" for the sake of
      # the required-check name; its scope is now every gate family in scripts/.
      - name: Lint the wired-or-dead gate pair and its shared helper
        run: |
          shellcheck -x -P SCRIPTDIR \
            scripts/check-rule-h.sh \
            scripts/check-rule-i.sh \
            scripts/lib/wired-or-dead-common.sh

      - name: Assert the source= directives actually resolve (not silently skipped)
        run: |
          # A `# shellcheck source=` directive that cannot be resolved is
          # reported as SC1091 and NOT followed. The step above already fails on
          # it, but that failure would be indistinguishable from any other
          # finding, so assert the specific condition here: linting WITHOUT
          # -P SCRIPTDIR must produce SC1091, proving the directives are load-
          # bearing rather than decorative.
          if shellcheck -x scripts/check-sentry-capture-has-init.sh 2>&1 | grep -q SC1091; then
            echo "OK: the source= directives are resolved by -P SCRIPTDIR, not by luck."
          else
            echo "FAIL: linting without -P SCRIPTDIR produced no SC1091, so the"
            echo "'# shellcheck source=' directives are no longer doing anything and"
            echo "this job's -P SCRIPTDIR flag proves nothing. Either the directives"
            echo "were removed (update this job) or shellcheck changed behaviour."
            exit 1
          fi

      # FOLLOW-849: the PreToolUse branch guard is a shell control that NOTHING
      # automated had ever linted or executed — it shipped worktree-blind and
      # survived six independent sightings because its only victims were agents
      # with no authority to fix it. Linted and EXERCISED here rather than in a
      # new job, for the same reason the wired-or-dead lint above lives here: a
      # job name that is not wired into the merge path is not a control.
      #
      # The fixture is the deliverable, not the fix. It asserts BOTH directions —
      # the guard stays silent inside a worktree AND still fires on a genuine
      # main-tree edit (including the two inverse shapes the reported defect
      # never exercised) — so a future change that merely makes the guard quiet
      # fails here. Hard gate, no continue-on-error, no secret dependency,
      # therefore no soft-skip.
      # FOLLOW-910 added the Bash half of the same guard. pre-bash-guard.sh had
      # FIVE blocking rules and ZERO test coverage until then, so it is linted and
      # exercised here for the first time — by the same harness, because the hook
      # contract it must satisfy is identical.
      - name: Lint the PreToolUse branch guards and their fixture harness
        run: |
          shellcheck .claude/hooks/pre-edit-branch-guard.sh \
            .claude/hooks/pre-bash-guard.sh \
            scripts/__tests__/pre-edit-branch-guard.test.sh

      - name: Run the branch-guard red-first fixture proof (both directions)
        run: bash scripts/__tests__/pre-edit-branch-guard.test.sh

  # ── Cross-language event contract gate (FOLLOW-198 / FOLLOW-168) ───────────
  # Asserts that the TypeScript DescriptionRequestedEventSchema required-field set
  # and the Python consumer's REQUIRED_FIELDS both match the single source of truth:
  #   packages/shared/contracts/description-event.required.json
  #
  # This is a HARD gate — no continue-on-error. Drift on either side fails the merge.
  # The existing test-python matrix is NOT used here because it has continue-on-error
  # on individual pytest runs. This dedicated job is always blocking.
  cross-language-contract:
    name: Cross-language event contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python side — validate that generate_description.REQUIRED_FIELDS == fixture
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install llm-gateway Python deps
        working-directory: apps/llm-gateway
        run: pip install -e ".[dev]"

      - name: Python contract test — REQUIRED_FIELDS matches shared fixture
        working-directory: apps/llm-gateway
        run: |
          python -m pytest src/jobs/test_description_event_contract.py -v \
            --tb=short \
            --no-header

      - name: Python contract test — listing-embed seed REQUIRED_FIELDS matches shared fixture (FOLLOW-435)
        working-directory: apps/llm-gateway
        run: |
          python -m pytest src/jobs/test_listing_embed_seed_event_contract.py -v \
            --tb=short \
            --no-header

      # TypeScript side — validate that DescriptionRequestedEventSchema ⊇ fixture
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package (required for schema imports)
        run: pnpm --filter @estalara/shared build

      - name: TypeScript contract test — DescriptionRequestedEventSchema ⊇ fixture
        run: |
          pnpm --filter @estalara/shared exec vitest run \
            src/__tests__/cross-runtime/description-event-contract.test.ts \
            --reporter=verbose

      - name: TypeScript contract test — listing-embed seed event schema ⊇ fixture (FOLLOW-435)
        run: |
          pnpm --filter @estalara/shared exec vitest run \
            src/__tests__/cross-runtime/listing-embed-seed-event-contract.test.ts \
            --reporter=verbose

  # ── Migration journal monotonicity + recency check (FOLLOW-149) ─────────
  # Enforces _journal.json invariants:
  #   1. Every entry's `when` is strictly > previous entry's `when` (drizzle
  #      silently skips out-of-order entries — see FOLLOW-149 root cause).
  #   2. Every entry's `when` is within 7 days of the matching SQL file's
  #      first-add git commit date (catches drizzle-kit year-drift bug).
  #   3. Entry count matches SQL file count.
  # Self-test included in the script (--self-test flag).
  migration-journal:
    name: Migration journal monotonicity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for `git log --diff-filter=A` per SQL file

      - name: Run journal self-test (validates the gate itself)
        run: bash scripts/check-migration-journal.sh --self-test

      - name: Validate _journal.json
        run: bash scripts/check-migration-journal.sh

  # ── Archetype seeds completeness check ───────────────────────────────────
  archetype-seeds-complete:
    name: Archetype seeds completeness check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert all 18 archetype seeds have names and descriptions
        run: npx tsx scripts/check-archetype-seeds.ts

  # ── Archetype embeddings not-NULL check (FOLLOW-341) ─────────────────────
  # Verifies that archetype_embeddings.embedding is NOT NULL for all 18 rows
  # in the live dev DB after pnpm seed:archetypes runs on push:main.
  #
  # Soft-skip contract (matching doppler-verify):
  #   When DOPPLER_TOKEN_DEV is absent (forked PRs / secret not yet provisioned)
  #   the job logs a clear notice and exits 0 — it does NOT block merges.
  #   When DOPPLER_TOKEN_DEV IS present, a non-zero exit means real NULL rows
  #   remain in the DB and `pnpm seed:archetypes` must be re-run.
  #
  # Trigger:
  #   Run manually via seed-archetypes.yml workflow_dispatch, or automatically
  #   on push:main via post-migrate-seed.yml before this check executes.
  #   This job READS the result; post-migrate-seed.yml WRITES the embeddings.
  archetype-embeddings-not-null:
    name: Archetype embeddings not-NULL check
    runs-on: ubuntu-latest
    # Soft-skip: forked PRs and pre-DOPPLER environments must not block on this.
    continue-on-error: true
    # Safety net: the assert opens a postgres-js connection; bound the job so a
    # stuck connection can never hang for the 360-minute default (FOLLOW-446).
    timeout-minutes: 8
    needs: [archetype-seeds-complete]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @estalara/db imports from @estalara/shared (e.g. src/upsert-conversion-label.ts),
      # so shared must be built first or the db build fails with TS2307 and this gate
      # never reaches the NULL assertion — i.e. silently stops verifying (FOLLOW-446).
      - name: Build @estalara/shared
        run: pnpm --filter @estalara/shared build

      - name: Build @estalara/db
        run: pnpm --filter @estalara/db build

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Check if DOPPLER_TOKEN_DEV is available
        id: doppler-check
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_DEV }}
        run: |
          if [ -z "${DOPPLER_TOKEN}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::DOPPLER_TOKEN_DEV is not set — skipping archetype-embeddings-not-null check."
            echo "Once DOPPLER_TOKEN_DEV is provisioned, this check will verify all 18 archetype"
            echo "embeddings are populated (non-NULL) in the dev database after pnpm seed:archetypes."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assert no NULL embeddings in archetype_embeddings
        if: steps.doppler-check.outputs.skip == 'false'
        run: |
          # Run node inside the @estalara/db package context so the bare
          # `@estalara/db` specifier self-resolves via its exports map. A plain
          # `node` from the repo root cannot resolve the workspace package
          # (ERR_MODULE_NOT_FOUND) and the assertion never runs (FOLLOW-446).
          doppler run --config dev -- pnpm --filter @estalara/db exec node --input-type=module <<'EOF'
          import { createAdminClient } from '@estalara/db';
          import { isNull } from 'drizzle-orm';
          import { archetypeEmbeddings } from '@estalara/db';

          const db = createAdminClient();
          const nullRows = await db
            .select({ archetypeName: archetypeEmbeddings.archetypeName })
            .from(archetypeEmbeddings)
            .where(isNull(archetypeEmbeddings.embedding));

          if (nullRows.length > 0) {
            const names = nullRows.map(r => r.archetypeName).join(', ');
            console.error(
              `[archetype-embeddings-not-null] FAIL: ${nullRows.length} archetype(s) have NULL embedding: ${names}`
            );
            console.error(
              '[archetype-embeddings-not-null] Run: pnpm seed:archetypes (or trigger seed-archetypes.yml workflow_dispatch)'
            );
            process.exit(1);
          }
          console.log('[archetype-embeddings-not-null] PASS: all 18 archetype embeddings populated.');
          // postgres-js keeps the connection open, so exit explicitly or node
          // hangs on the live socket until the job timeout (FOLLOW-446).
          process.exit(0);
          EOF
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_DEV }}

  # ── SDK E2E tests (Playwright + Chromium) ────────────────────────────────
  sdk-e2e:
    name: SDK E2E tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package (required by SDK DTS build)
        run: pnpm --filter=@estalara/shared build

      - name: Build SDK
        run: pnpm --filter=@estalara/sdk build

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
        working-directory: packages/sdk

      - name: Run e2e tests
        run: pnpm test:e2e
        working-directory: packages/sdk
