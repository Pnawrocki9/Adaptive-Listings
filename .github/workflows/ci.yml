name: CI

on:
  push:
    branches:
      - main
      - "devops-engineer/**"
      - "backend-engineer/**"
      - "sdk-engineer/**"
      - "data-engineer/**"
      - "ml-engineer/**"
      - "qa-engineer/**"
      - "compliance-engineer/**"
      - "architect/**"
      - "pm-orchestrator/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Doppler service token verification ──────────────────────────────────
  # Verifies that DOPPLER_TOKEN_DEV is provisioned and authenticates to Doppler.
  # Secret scope: dev + staging configs only. Production token is NOT in repo
  # secrets — it lives in the Vercel-only path.
  #
  # Soft-degradation contract (forked PRs / token not yet provisioned):
  #   If DOPPLER_TOKEN_DEV is absent, the job logs a clear message and exits 0.
  #   It does NOT fail — external contributors should not be blocked on an
  #   internal secrets gate.
  #
  # When DOPPLER_TOKEN_DEV IS provisioned, this job MUST pass (exit 0) for CI
  # to be considered fully green. It is the signal that Doppler CI hygiene is
  # operational and downstream jobs (FOLLOW-063, FOLLOW-068, FOLLOW-039) can
  # use `doppler run --` to inject secrets.
  #
  # ESCALATION: DOPPLER_TOKEN_DEV secret provisioning is tracked in
  # backlog/ESCALATIONS.md. Add it at: GitHub repo → Settings → Secrets and
  # variables → Actions → New repository secret.
  #   Name:  DOPPLER_TOKEN_DEV
  #   Value: Doppler service token scoped to project=estalara, config=dev
  #          (create at: https://dashboard.doppler.com → project → Access → Service Tokens)
  doppler-verify:
    name: Doppler verify
    runs-on: ubuntu-latest
    # Non-blocking — forked PRs and repos without the secret still pass CI.
    # When the secret IS present, a failed auth means real misconfiguration.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Check token presence and verify Doppler auth
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_DEV }}
        run: |
          if [ -z "${DOPPLER_TOKEN}" ]; then
            echo "::notice::DOPPLER_TOKEN_DEV is not set — skipping Doppler auth verification."
            echo "This is expected for forked PRs and environments where the secret has not yet"
            echo "been provisioned. See backlog/ESCALATIONS.md for provisioning instructions."
            echo "Once DOPPLER_TOKEN_DEV is added to repo secrets, this step will authenticate"
            echo "and confirm the CI Doppler integration is fully operational."
            exit 0
          fi
          echo "DOPPLER_TOKEN_DEV is present — verifying auth..."
          doppler me
          echo "Doppler auth verified. CI can now use 'doppler run --' to inject secrets."

  # ── Static checks (parallel, ~3min) ─────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @estalara/shared build

      - name: Lint
        run: pnpm turbo run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies first
        run: pnpm turbo run build --filter='!@estalara/control-plane' --filter='./packages/*'

      - name: Typecheck
        run: pnpm turbo run typecheck

  # ── Rule I hard gate: all exported symbols must have non-test importers ──
  rule-i:
    name: Rule I — wired-or-dead check
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Rule I — wired-or-dead check
        run: bash scripts/check-rule-i.sh

  # ── Unit / smoke tests ───────────────────────────────────────────────────
  test-node:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    strategy:
      matrix:
        node-version: ["22"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo run build --filter='./packages/*'

      - name: Run tests
        run: pnpm turbo run test --filter='./packages/*' --filter='@estalara/ingest' --filter='@estalara/decision-api' --filter='@estalara/control-plane'

  test-python:
    name: Test (Python)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
        app:
          - intent-engine
          - adaptation-engine
          - llm-gateway
          - stream-consumer
          - archetype-pipeline
          - data-quality
          - auto-detect
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest src/ -v

  # ── Build ────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all TypeScript packages
        run: pnpm turbo run build --filter='./packages/*' --filter='@estalara/ingest' --filter='@estalara/decision-api'

      - name: SDK bundle size gate (<40KB gzip)
        run: pnpm --filter=@estalara/sdk build:check

  # ── Control-plane build (Next.js, separate job — takes longer) ───────────
  build-control-plane:
    name: Build (control-plane)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build control-plane
        run: pnpm turbo run build --filter='@estalara/control-plane'

  # ── Format check ─────────────────────────────────────────────────────────
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec prettier --check .

  # ── Security: Gitleaks scan ──────────────────────────────────────────────
  gitleaks-scan:
    name: Gitleaks secrets scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for comprehensive scan

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  # ── ClickHouse migrations smoke test ─────────────────────────────────────
  clickhouse-smoke:
    name: ClickHouse migrations smoke
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        ports:
          - 8123:8123
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: clickhouse
    steps:
      - uses: actions/checkout@v4

      - name: Wait for ClickHouse
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8123/ping && break
            echo "  waiting... ($i/30)"
            sleep 3
          done
          curl -sf http://localhost:8123/ping

      - name: Apply migrations (LOCAL=1 → MergeTree)
        env:
          CLICKHOUSE_PASSWORD: clickhouse
        run: |
          LOCAL=1 CLICKHOUSE_URL=http://localhost:8123 \
            ./infra/clickhouse/scripts/migrate.sh

      - name: Run smoke test
        env:
          CLICKHOUSE_PASSWORD: clickhouse
        run: |
          LOCAL=1 CLICKHOUSE_URL=http://localhost:8123 \
            ./infra/clickhouse/scripts/smoke-test.sh

  # ── Tracer query-builders live ClickHouse guard (FOLLOW-316) ────────────
  # Submits each K.3.6 tracer builder against a real ClickHouse engine so a
  # query-analysis error (Code 386 NO_COMMON_TYPE — the class fixed by
  # FOLLOW-315) fails CI rather than slipping through mock-only unit coverage.
  # AC3: REQUIRE_CLICKHOUSE=1 makes the spec hard-fail if the container is
  # absent (no silent skip).
  tracer-query-smoke:
    name: Tracer query-builders live ClickHouse guard
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        ports:
          - 8123:8123
        env:
          # Skip user-setup so the default user has no password (same as local
          # dev — FOLLOW-315 verification used this flag). The tracer client
          # (clickhouse-tracer.ts authHeaders) sends no Authorization header
          # when CLICKHOUSE_PASSWORD is empty, which matches a passwordless CH.
          CLICKHOUSE_SKIP_USER_SETUP: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @estalara/shared build

      - name: Wait for ClickHouse
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8123/ping && break
            echo "  waiting... ($i/30)"
            sleep 3
          done
          curl -sf http://localhost:8123/ping

      - name: Apply migrations (LOCAL=1 → MergeTree, passwordless)
        run: |
          LOCAL=1 CLICKHOUSE_URL=http://localhost:8123 \
            ./infra/clickhouse/scripts/migrate.sh

      - name: Run tracer integration tests (AC1 happy-path + AC2 negative control)
        env:
          CLICKHOUSE_URL: http://localhost:8123
          CLICKHOUSE_PASSWORD: ""
          REQUIRE_CLICKHOUSE: "1"
        # Scope vitest to the tracer file only. The DSR integration spec
        # (clickhouse-dsr.integration.test.ts) has known latent failures tracked
        # by FOLLOW-317; running it here would produce false negatives. When
        # FOLLOW-317 lands, add its file path alongside this one.
        working-directory: apps/control-plane
        run: |
          pnpm exec vitest run --config vitest.integration.config.ts \
            src/__tests__/integration/clickhouse-tracer.integration.test.ts

  # ── Auto-Detection corpus gate (TICKET-AUTO-005) ─────────────────────────
  # Runs detectSiteSchema against 24 synthetic platform fixtures and asserts
  # pooled precision >= 95% and recall >= 80%. Uploads corpus-report.json as a
  # build artifact so reviewers can inspect per-platform metrics.
  corpus-gate:
    name: Auto-Detection corpus gate
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @estalara/shared build

      - name: Run corpus CI gate
        run: pnpm --filter @estalara/sdk test:corpus

      - name: Upload corpus report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-report
          path: packages/sdk/corpus-report.json
          retention-days: 14

  # ── Rule H hard gate: schema scaffolds must have runtime consumers ────────
  rule-h:
    name: Rule H — schema scaffold wiring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch for diff
        run: git fetch origin main --depth=50

      - name: Run Rule H check
        run: bash scripts/check-rule-h.sh origin/main

  # ── Rule J hard gate: mirror-code pairs must stay in sync ───────────────
  rule-j:
    name: Rule J — mirror-code sync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check mirror-file byte identity
        run: bash scripts/check-mirror-files.sh

  # ── Privacy Notice key-sync gate (FOLLOW-230 / Rule N) ──────────────────
  # Asserts that every *_STORAGE_KEY, *_KEY_PREFIX, and *_DISMISS_KEY constant
  # in packages/sdk/src (non-test files) is disclosed in the Privacy Notice
  # template (docs/compliance/PRIVACY_NOTICE_TEMPLATE.md §4).
  #
  # A key present in shipped SDK code but absent from the privacy notice is a
  # Rule N compliance gap: a disclosure-by-omission that makes the notice
  # factually incomplete for EU/UK data subjects (RETRO-036 CB-1).
  #
  # Hard gate — no continue-on-error.
  privacy-notice-keys-sync:
    name: Privacy Notice SDK key-sync (Rule N / FOLLOW-230)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert all SDK storage keys are disclosed in Privacy Notice §4
        run: bash scripts/check-privacy-notice-keys.sh

  # ── Cross-language event contract gate (FOLLOW-198 / FOLLOW-168) ───────────
  # Asserts that the TypeScript DescriptionRequestedEventSchema required-field set
  # and the Python consumer's REQUIRED_FIELDS both match the single source of truth:
  #   packages/shared/contracts/description-event.required.json
  #
  # This is a HARD gate — no continue-on-error. Drift on either side fails the merge.
  # The existing test-python matrix is NOT used here because it has continue-on-error
  # on individual pytest runs. This dedicated job is always blocking.
  cross-language-contract:
    name: Cross-language event contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python side — validate that generate_description.REQUIRED_FIELDS == fixture
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install llm-gateway Python deps
        working-directory: apps/llm-gateway
        run: pip install -e ".[dev]"

      - name: Python contract test — REQUIRED_FIELDS matches shared fixture
        working-directory: apps/llm-gateway
        run: |
          python -m pytest src/jobs/test_description_event_contract.py -v \
            --tb=short \
            --no-header

      # TypeScript side — validate that DescriptionRequestedEventSchema ⊇ fixture
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package (required for schema imports)
        run: pnpm --filter @estalara/shared build

      - name: TypeScript contract test — DescriptionRequestedEventSchema ⊇ fixture
        run: |
          pnpm --filter @estalara/shared exec vitest run \
            src/__tests__/cross-runtime/description-event-contract.test.ts \
            --reporter=verbose

  # ── Migration journal monotonicity + recency check (FOLLOW-149) ─────────
  # Enforces _journal.json invariants:
  #   1. Every entry's `when` is strictly > previous entry's `when` (drizzle
  #      silently skips out-of-order entries — see FOLLOW-149 root cause).
  #   2. Every entry's `when` is within 7 days of the matching SQL file's
  #      first-add git commit date (catches drizzle-kit year-drift bug).
  #   3. Entry count matches SQL file count.
  # Self-test included in the script (--self-test flag).
  migration-journal:
    name: Migration journal monotonicity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for `git log --diff-filter=A` per SQL file

      - name: Run journal self-test (validates the gate itself)
        run: bash scripts/check-migration-journal.sh --self-test

      - name: Validate _journal.json
        run: bash scripts/check-migration-journal.sh

  # ── Archetype seeds completeness check ───────────────────────────────────
  archetype-seeds-complete:
    name: Archetype seeds completeness check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert all 18 archetype seeds have names and descriptions
        run: npx tsx scripts/check-archetype-seeds.ts

  # ── SDK E2E tests (Playwright + Chromium) ────────────────────────────────
  sdk-e2e:
    name: SDK E2E tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package (required by SDK DTS build)
        run: pnpm --filter=@estalara/shared build

      - name: Build SDK
        run: pnpm --filter=@estalara/sdk build

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
        working-directory: packages/sdk

      - name: Run e2e tests
        run: pnpm test:e2e
        working-directory: packages/sdk
