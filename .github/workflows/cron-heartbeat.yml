# cron-heartbeat.yml — absence-of-signal detector for scheduled jobs (FOLLOW-893).
#
# WHAT THIS CLOSES
#   `apps/data-quality/src/crons/schema_validation.py` runs on `modal.Cron("0 2 * * *")`
#   and fired for the first time in the project's history on 2026-08-08. Its FAILURES were
#   visible only to whoever opened the Modal dashboard, and a run that NEVER STARTED — the
#   highest-prior failure mode for a first-ever schedule — emitted nothing at all. Drift
#   EVENTS already had a channel (Sentry). The gap was the ABSENCE case. This workflow is
#   the outside observer: a process that is not the cron, asserting the cron ran.
#
# WHY THE SCHEDULE IS 05:00 UTC AND THE WINDOW IS 26h (load-bearing)
#   cron fires 02:00 UTC; this checks at 05:00 UTC with --max-age-hours 26:
#     today's run happened            → age ≈ 3h  → PASS
#     today's run missed (yesterday ok) → age ≈ 27h → FAIL
#   Any earlier check time makes a 26h window silently tolerate one missed run — the alarm
#   would stop alarming while staying green. Do not move this cron earlier without
#   shrinking the window.
#
# WHY THE ALARM IS A RED WORKFLOW RUN
#   A failed GitHub Actions run is a structured sink with notifications (RETRO-010
#   FOLLOW-111: no signal a future decision depends on may live in a console.warn). It
#   costs nothing recurring and needs no new vendor — FOLLOW-893 asked explicitly for the
#   cheapest thing that works over new monitoring infrastructure.
#
# SOFT-SKIP CONTRACT (mirrors db-migrate.yml / modal-deploy.yml)
#   `assert-prod-heartbeat` soft-skips ONLY when DOPPLER_TOKEN_PRD is unset — "dependency
#   not configured". If the token IS present and the heartbeat is missing, stale, or the
#   table is absent, the job goes RED. There is no second skip gate, and the checker
#   script itself exits 2 (not 0) when it finds no connection string, so an unconfigured
#   environment can never be mistaken for a healthy one.
#
# RULE Q — THIS DETECTOR HAS OBSERVED ITS OWN FAILURE
#   `detector-negative-control` runs on every push/PR against a throwaway Postgres and
#   asserts the alarm FIRES in all three absence shapes (no table / no row / stale row)
#   and stays silent on the one healthy shape. A green check that has never seen itself
#   go red is not evidence, so that negative control is part of the pipeline, not a
#   one-off screenshot.
#
# WHAT FOLLOW-904 ADDED HERE, AND WHY IT IS HERE RATHER THAN IN A NEW WORKFLOW
#   RETRO-262 reduced the whole chain to one test: could this control pass while every
#   container dies at line 1? After PR #698 the estate had FOUR controls over the Modal
#   apps (secret gate, `modal app list`, the deploy job, the static local-source gate) and
#   all four read the artefact's DESCRIPTION. This workflow was the estate's ONLY
#   effect-axis control, and it covered ONE of the three deployed Modal apps.
#   `assert-modal-container-effect` extends it to the other two:
#     intent-engine — `process_chat_message.remote()` with a throwaway tenant and
#       `profiling_opt_out=True`, asserting the returned payload echoes the ids we sent.
#       Its four declared local modules are imported INSIDE that function body, so nothing
#       short of running it can prove the FOLLOW-900 fix is real. It had NEVER been invoked
#       in prod, which is the only reason its identical defect was latent.
#     llm-gateway  — an unauthenticated POST to description_requested_endpoint asserting
#       HTTP 401: a Modal web endpoint only answers once its module has been imported to
#       completion, and 401 is produced by application code. No LLM spend, no writes.
#   FOLLOW-904 AC(2) says prefer extending the working pattern to inventing a second
#   mechanism, and this workflow already IS the "process that is not the artefact,
#   asserting the artefact ran" — same schedule, same alarm channel, same soft-skip
#   contract. The workflow `name:` is deliberately NOT changed: it is what branch
#   protection and every historical run reference by, and renaming it to match the wider
#   scope would silently orphan those references. The job names carry the scope instead.
#
# WHEN THE MODAL PROBE RUNS (FOLLOW-904 AC4 — decided, not left implicit)
#   BOTH: the daily 05:00 schedule here (a post-deploy-only probe cannot catch decay — a
#   revoked secret or a wiped `estalara-secrets` breaks a container with no deploy in
#   sight) AND a post-deploy step in modal-deploy.yml (a schedule-only probe leaves a bad
#   deploy live for up to 24h). Neither alone is sufficient, and they cost the same.
#
# BRANCH TRIGGERS: `**` deliberately (ESC-011). PR #149 on `feat/...` got ZERO CI runs and
#   the "lasting fix" was then violated by PR #158 on `claude/...`. An allowlist of agent
#   prefixes has now failed twice; a detector whose own tests do not run on the branch
#   that changes it is the exact class of bug this workflow exists to catch.

name: Cron Heartbeat (FOLLOW-893)

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  schedule:
    # 05:00 UTC — three hours after the 02:00 UTC schema-validation cron. See the
    # window arithmetic above before changing this.
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: cron-heartbeat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Rule Q negative control ───────────────────────────────────────────────────────────
  # Executes the alarm. Not a description of the alarm, not a unit test of a helper —
  # the real script, against a real Postgres, in all four states.
  detector-negative-control:
    name: Detector negative control (alarm must fire on absence)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heartbeat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heartbeat_test

    steps:
      - uses: actions/checkout@v4

      # CASE 0 — the sink itself is missing. Must ALARM. This is run BEFORE the migration
      # on purpose: "migration not applied to prod" is a real deployment state, and a
      # checker that treats a missing table as "nothing to worry about" is worse than none.
      - name: CASE 0 — no cron_heartbeats table at all → expect ALARM (exit 1)
        run: |
          set +e
          out=$(bash scripts/check-cron-heartbeat.sh --job validate_schemas --max-age-hours 26 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 1 ]; then
            echo "::error::expected exit 1 (alarm) with no table, got ${code}"; exit 1
          fi
          echo "$out" | grep -q "does not exist" || {
            echo "::error::alarm text did not name the missing table"; exit 1; }
          echo "OK — alarm fired on missing sink."

      - name: Apply migration 0037_cron_heartbeats
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/db/migrations/0037_cron_heartbeats.sql

      # Minimal stand-in for schema_validation_history so the AC3 digest path is exercised
      # too. Only the columns the digest reads — this is not a schema mirror.
      - name: Create a minimal schema_validation_history for the digest path
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            CREATE TABLE schema_validation_history (
              id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
              tenant_id uuid NOT NULL,
              drift_detected boolean NOT NULL DEFAULT false,
              run_at timestamptz NOT NULL DEFAULT NOW(),
              error text
            );"

      # CASE 1 — table exists, job has never once succeeded. Must ALARM. This is the exact
      # state prod is in until the redeployed cron writes its first heartbeat.
      - name: CASE 1 — table but no heartbeat row → expect ALARM (exit 1)
        run: |
          set +e
          out=$(bash scripts/check-cron-heartbeat.sh --job validate_schemas --max-age-hours 26 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 1 ]; then
            echo "::error::expected exit 1 (alarm) with no heartbeat row, got ${code}"; exit 1
          fi
          echo "$out" | grep -q "no heartbeat has EVER been recorded" || {
            echo "::error::alarm text did not report a never-run job"; exit 1; }
          echo "OK — alarm fired on never-run job."

      # CASE 2 — the run that silently stopped happening. 27h old = exactly one missed
      # 02:00 firing as observed from a 05:00 check.
      - name: CASE 2 — heartbeat 27h stale → expect ALARM (exit 1)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            INSERT INTO cron_heartbeats (job_name, last_success_at, run_detail)
            VALUES ('validate_schemas', NOW() - INTERVAL '27 hours', '{\"tenant_domain_pairs\": 1}')
            ON CONFLICT (job_name) DO UPDATE SET last_success_at = EXCLUDED.last_success_at;"
          set +e
          out=$(bash scripts/check-cron-heartbeat.sh --job validate_schemas --max-age-hours 26 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 1 ]; then
            echo "::error::expected exit 1 (alarm) on a 27h-stale heartbeat, got ${code}"; exit 1
          fi
          echo "$out" | grep -q "has not completed successfully" || {
            echo "::error::alarm text did not report staleness"; exit 1; }
          echo "OK — alarm fired on a single missed run."

      # CASE 3 — the healthy shape. Must NOT alarm. Without this the detector could be
      # trivially "passing" by always failing.
      - name: CASE 3 — heartbeat 3h fresh → expect PASS (exit 0)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            UPDATE cron_heartbeats SET last_success_at = NOW() - INTERVAL '3 hours'
            WHERE job_name = 'validate_schemas';"
          bash scripts/check-cron-heartbeat.sh --job validate_schemas --max-age-hours 26
          echo "OK — healthy heartbeat passes."

      # CASE 4 — no connection string at all must be exit 2 (unconfigured), never 0.
      # This is what keeps "nothing was checked" from ever looking like "all good".
      - name: CASE 4 — no connection string → expect UNCONFIGURED (exit 2), never 0
        env:
          DATABASE_URL: ""
        run: |
          set +e
          out=$(bash scripts/check-cron-heartbeat.sh --job validate_schemas 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 2 ]; then
            echo "::error::expected exit 2 (unconfigured), got ${code}"; exit 1
          fi
          echo "OK — unconfigured is distinguishable from healthy."

  # ── The real daily assertion against prod ─────────────────────────────────────────────
  assert-prod-heartbeat:
    name: Assert validate_schemas ran in the last 26h (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Not on every branch push: this one reads prod. Scheduled run is the load-bearing
    # invocation; main-push and manual dispatch exist so the wire can be exercised on
    # demand instead of waiting a day to discover it is broken.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@v4

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      # Soft-skip ONLY on "dependency not configured". A present token over a missing or
      # stale heartbeat is a hard red below — there is no second skip gate.
      - name: Check DOPPLER_TOKEN_PRD presence
        id: token-check
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
        run: |
          if [ -z "${DOPPLER_TOKEN}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::DOPPLER_TOKEN_PRD is not set — cannot read the prod heartbeat."
            echo "This job is INERT until DOPPLER_TOKEN_PRD is provisioned. It is NOT an all-clear."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assert validate_schemas heartbeat < 26h old
        if: steps.token-check.outputs.skip == 'false'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
        run: |
          doppler run --config prd -- bash scripts/check-cron-heartbeat.sh \
            --job validate_schemas --max-age-hours 26

  # ── Rule Q negative control for the Modal effect probe (FOLLOW-904 AC3) ───────────────
  # Runs on every push/PR with NO secrets and NO network beyond 127.0.0.1. It executes the
  # real scripts/check-modal-container-effect.py against a substituted BACKEND — a fake
  # `modal` module on PYTHONPATH and a one-status HTTP server — in every absence shape:
  # ModuleNotFoundError in the container (the literal FOLLOW-900 traceback), app not
  # deployed, a payload that does not echo the ids, an empty payload, a 500, a 200 for an
  # invalid bearer, a dead socket, and no credentials at all (exit 2, never 0). Plus the
  # two healthy shapes, so the probe cannot be "correct" by always alarming.
  modal-effect-negative-control:
    name: Modal effect probe negative control (alarm must fire on absence)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No `pip install modal` on purpose: the fake backend is what this job exercises, and
      # installing the real client would let a stray import silently reach production.
      - name: Execute the alarm in every absence shape
        run: bash scripts/negative-control-modal-effect.sh

  # ── The real assertion against prod (FOLLOW-904 AC1/AC2) ─────────────────────────────
  # A process that is NOT the deploy job, asserting that two deployed Modal apps reach
  # line 1 of their own logic. `environment: production` mirrors modal-deploy.yml so the
  # MODAL_TOKEN_* secrets resolve the same way there and here.
  assert-modal-container-effect:
    name: Assert intent-engine + llm-gateway containers reach their own logic (prod)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    # Same trigger set as assert-prod-heartbeat: this one talks to production.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal client
        run: pip install modal

      # Soft-skip ONLY on "dependency not configured" (no Modal token), identical to
      # modal-deploy.yml. A present token over a container that cannot start is a hard red
      # below — the probe itself exits 2, never 0, when it finds no credentials, so an
      # unconfigured runner can never be mistaken for a healthy production.
      - name: Check MODAL_TOKEN_ID presence
        id: modal-token-check
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
        run: |
          if [ -z "${MODAL_TOKEN_ID}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::MODAL_TOKEN_ID is not set — cannot invoke the deployed apps."
            echo "This job is INERT until MODAL_TOKEN_ID is provisioned. It is NOT an all-clear."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe intent-engine and llm-gateway for an observable effect
        if: steps.modal-token-check.outputs.skip == 'false'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python3 scripts/check-modal-container-effect.py --app all

  # ── FOLLOW-935: the consent-text effect probe, and the control that proves it can go red ──
  #
  # This pair exists because the FOLLOW-929 P0 was closed by a test that inspects
  # `nextConfig.headers()` — a config object, not a response. That test would pass unchanged if
  # Vercel stopped applying `headers()` to `public/` assets, if the asset moved, or if the deploy
  # never ran. The only observation of the real response was one curl typed by a retrospective
  # agent. A one-time observation is not a control.
  consent-text-negative-control:
    name: Consent-text effect probe negative control (alarm must fire on absence)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Synthesizes every absence shape against a local one-response server (Rule AM: synthesize,
      # never mutate the live source). No secrets, no network beyond 127.0.0.1 — which is why this
      # half CAN run on a pull request, unlike the prod assertion below.
      - name: Execute the alarm in every absence shape
        run: bash scripts/negative-control-consent-text-headers.sh

  # The real assertion against the DEPLOYED origin (FOLLOW-935 AC(1)).
  # Same trigger set as the other prod-facing jobs here: the header lives on the production
  # deploy, never on a preview, so this cannot be a PR gate — see the PR body and
  # `.github/required-checks.txt`, where it is registered `any-state` for that reason.
  assert-consent-text-headers:
    name: Assert consent-text CORS + cache headers on the deployed origin (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@v4

      # No secrets: the document is public and identifier-free by ADR-0021 §D3, so this probe
      # needs no credentials and cannot be INERT for want of one. It either observes the deployed
      # response or exits 2 UNDETERMINED.
      - name: Probe the deployed consent-text.json for its CORS + cache effect
        run: bash scripts/check-consent-text-headers.sh

  # cron-heartbeat runs SIX jobs. Six copies of the notify step would mean six Slack messages for
  # one bad night, which is how a channel becomes unreadable. One summary job that depends on all
  # of them sends exactly one. [FOLLOW-986 / ESC-058]
  announce-nightly-failure:
    name: Announce a failed nightly heartbeat
    runs-on: ubuntu-latest
    needs:
      - detector-negative-control
      - assert-prod-heartbeat
      - modal-effect-negative-control
      - assert-modal-container-effect
      - consent-text-negative-control
      - assert-consent-text-headers
    if: failure() && github.event_name == 'schedule'
    steps:
      - name: Post to Slack if configured, annotate always
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_E2E_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sS -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\"🚨 NIGHTLY FAILED — Cron Heartbeat — <$RUN_URL|view run>\"}" \
              && echo "Slack notified."
          else
            echo "::error title=Nightly heartbeat failed with NO notification channel::\
          SLACK_E2E_WEBHOOK_URL is not set. See $RUN_URL — and backlog/ESCALATIONS.md ESC-058."
          fi
