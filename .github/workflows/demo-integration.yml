name: Demo integration

# Runs the detect → activate → adapt → SDK DOM mutation E2E spec with a live
# Next.js dev server and seeded demo DB fixtures.
#
# Triggers:
#   - pull_request:  any PR touching control-plane, SDK, or e2e tests (and this file)
#   - push: main
#
# Soft-skip strategy (FOLLOW-040 / FOLLOW-068):
#   If DOPPLER_TOKEN is not available the job cannot inject DB credentials and
#   therefore cannot start Next.js with a live Supabase connection.  Rather than
#   blocking CI, the job detects the missing secret and exits 0 with a clear
#   diagnostic.  The check-secret step is the gate; all subsequent steps use
#   `if: env.HAS_CREDS == 'true'` so they are skipped cleanly.
#   Remove the soft-skip once FOLLOW-040 lands and DOPPLER_TOKEN_DEV is confirmed
#   present in GitHub Actions secrets.
#
# Secret required:
#   E2E_BEARER_TOKEN — pre-signed JWT for the demo/canary E2E tenant (tnt_canary_eu).
#   The token authenticates Steps 1-3 in tests/e2e/sprint-9-5-demo.spec.ts.
#   If this secret is not yet provisioned the spec's beforeAll() fails fast with
#   an actionable error message (FOLLOW-067 bundled here).
#   Provisioning request: see backlog/ESCALATIONS.md ESC-009.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "apps/control-plane/**"
      - "packages/sdk/**"
      - "tests/e2e/**"
      - ".github/workflows/demo-integration.yml"

concurrency:
  group: demo-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo-integration:
    name: Demo integration (detect → activate → adapt → SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # ── Check whether DB credentials are available ───────────────────────
      # DOPPLER_TOKEN_DEV gates DB credential injection.  Without it the Next.js
      # server cannot connect to Supabase and the test would hang on 503s.
      # Soft-skip until FOLLOW-040 provisions the secret in CI.
      - name: Check DB credentials availability
        id: check-creds
        run: |
          if [ -n "$DOPPLER_TOKEN" ]; then
            echo "HAS_CREDS=true" >> "$GITHUB_ENV"
            echo "DB credentials available — full E2E run."
          else
            echo "HAS_CREDS=false" >> "$GITHUB_ENV"
            echo "::notice title=demo-integration soft-skip::DOPPLER_TOKEN not set — skipping full E2E run. This is expected until FOLLOW-040 provisions the secret. Static contract tests still run via the standard test-node job."
          fi
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_DEV }}

      # ── Node + pnpm setup (always, even for soft-skip path) ──────────────
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Build packages required by the spec ──────────────────────────────
      - name: Build @estalara/shared
        if: env.HAS_CREDS == 'true'
        run: pnpm --filter @estalara/shared build
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

      # ── Install Doppler CLI and inject DB env vars ────────────────────────
      - name: Install Doppler CLI
        if: env.HAS_CREDS == 'true'
        uses: dopplerhq/cli-action@v3

      - name: Export DB env vars via Doppler
        if: env.HAS_CREDS == 'true'
        run: doppler secrets download --no-file --format env --config dev >> "$GITHUB_ENV"
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_DEV }}

      # ── Start Next.js dev server in the background ────────────────────────
      # The server must be running before vitest executes.  We poll /api/adapt
      # (GET — unauthenticated, returns 401) to confirm it is up.
      - name: Start Next.js dev server
        if: env.HAS_CREDS == 'true'
        run: pnpm --filter @estalara/control-plane dev &
        env:
          NEXT_PUBLIC_TEST_E2E: "true"
          PORT: "3000"

      - name: Wait for Next.js to be ready
        if: env.HAS_CREDS == 'true'
        run: |
          echo "Waiting for Next.js on http://localhost:3000 …"
          for i in $(seq 1 40); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/adapt || echo "000")
            if [ "$STATUS" = "401" ] || [ "$STATUS" = "405" ] || [ "$STATUS" = "200" ]; then
              echo "Next.js ready (HTTP $STATUS) after ${i}×3 s"
              exit 0
            fi
            echo "  attempt $i/40 — HTTP $STATUS — waiting 3 s …"
            sleep 3
          done
          echo "Next.js did not become ready within 120 s — aborting."
          exit 1

      # ── Run the demo E2E spec ─────────────────────────────────────────────
      # NEXT_PUBLIC_TEST_E2E=true unlocks the 5 integration steps.
      # E2E_BEARER_TOKEN authenticates calls to /api/detect, /api/schema/activate,
      # and /api/adapt.  The spec's beforeAll() fails fast with an actionable error
      # if the token is absent (FOLLOW-067 bundled into this ticket).
      # E2E_TENANT_ID targets the demo/canary tenant seeded with DEMO_LISTING_MANIFEST
      # fixtures (FOLLOW-046 auto-seeds on activation).
      - name: Run demo integration spec
        if: env.HAS_CREDS == 'true'
        run: pnpm --filter @estalara/e2e-smoke test:e2e tests/e2e/sprint-9-5-demo.spec.ts
        env:
          NEXT_PUBLIC_TEST_E2E: "true"
          E2E_BASE_URL: "http://localhost:3000"
          E2E_BEARER_TOKEN: ${{ secrets.E2E_BEARER_TOKEN }}
          E2E_TENANT_ID: ${{ vars.E2E_TENANT_ID || 'est_test_e2e_tenant' }}

      # ── Soft-skip summary ─────────────────────────────────────────────────
      - name: Soft-skip notice (credentials unavailable)
        if: env.HAS_CREDS == 'false'
        run: |
          echo ""
          echo "=================================================="
          echo "  demo-integration: SOFT-SKIP"
          echo "=================================================="
          echo ""
          echo "  Reason: DOPPLER_TOKEN_DEV secret not available in this CI context."
          echo "  Impact: The detect→activate→adapt→SDK E2E steps did NOT run."
          echo "          Static contract tests (5 always-run tests) still execute"
          echo "          in the standard 'test-node' CI job."
          echo ""
          echo "  To activate the full E2E run:"
          echo "    1. Ensure FOLLOW-040 (Doppler CI hygiene) is merged."
          echo "    2. Add DOPPLER_TOKEN_DEV to GitHub Actions secrets."
          echo "    3. Add E2E_BEARER_TOKEN to GitHub Actions secrets"
          echo "       (see backlog/ESCALATIONS.md ESC-009)."
          echo ""
          echo "  This job exits 0 and does NOT block CI green."
          echo "=================================================="
