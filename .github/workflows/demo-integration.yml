name: Demo integration

# Runs the detect → activate → adapt → SDK DOM mutation E2E spec with a live
# Next.js dev server and seeded demo DB fixtures.
#
# Triggers:
#   - pull_request:  any PR touching control-plane, SDK, or e2e tests (and this file)
#   - push: main
#
# Fail-loud strategy (FOLLOW-079):
#   DOPPLER_TOKEN_DEV and E2E_BEARER_TOKEN are required. If either is absent the
#   job fails immediately with a clear diagnostic. This job should catch real
#   regressions in the detect→activate→adapt→SDK chain — silent passes hide bugs.
#
#   DOPPLER_TOKEN_DEV was provisioned in GitHub Actions secrets by FOLLOW-040.
#   E2E_BEARER_TOKEN provisioning request: see backlog/ESCALATIONS.md ESC-009.
#
# Branch protection:
#   This job should be added to required status checks in GitHub:
#   Settings → Branches → Branch protection rules → main →
#   "Demo integration (detect → activate → adapt → SDK)"
#   This is a manual action for Piotr — do NOT add it via Terraform/API.
#
# Secrets required:
#   DOPPLER_TOKEN_DEV — Doppler service token (project=estalara, config=dev).
#                       Used to inject DATABASE_URL, SUPABASE_* keys, JWT_SECRET
#                       into the Next.js dev server.
#   E2E_BEARER_TOKEN  — pre-signed JWT for the demo/canary E2E tenant (tnt_canary_eu).
#                       The token authenticates Steps 1-3 in
#                       tests/e2e/sprint-9-5-demo.spec.ts.
#                       The spec's beforeAll() fails fast if this token is absent.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "apps/control-plane/**"
      - "packages/sdk/**"
      - "tests/e2e/**"
      - ".github/workflows/demo-integration.yml"

concurrency:
  group: demo-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo-integration:
    name: Demo integration (detect → activate → adapt → SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # ── Check whether DB credentials are available ───────────────────────
      # DOPPLER_TOKEN_DEV gates DB credential injection.  Without it the Next.js
      # server cannot connect to Supabase and the test would hang on 503s.
      # Fail loud: if the secret is absent, CI is misconfigured — exit 1 so the
      # problem is surfaced immediately instead of silently skipping real checks.
      - name: Check DB credentials availability (fail-loud)
        id: check-creds
        run: |
          if [ -n "$DOPPLER_TOKEN" ]; then
            echo "DB credentials available — full E2E run."
          else
            echo "::error title=demo-integration misconfigured::DOPPLER_TOKEN_DEV not set — CI misconfigured; check GitHub Actions secrets."
            echo "Add DOPPLER_TOKEN_DEV at: GitHub repo → Settings → Secrets and variables → Actions."
            echo "Value: Doppler service token scoped to project=estalara, config=dev."
            exit 1
          fi
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_DEV }}

      # ── Node + pnpm setup ─────────────────────────────────────────────────
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Build packages required by the spec ──────────────────────────────
      - name: Build @estalara/shared
        run: pnpm --filter @estalara/shared build
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

      # ── Install Doppler CLI and inject DB env vars ────────────────────────
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Export DB env vars via Doppler
        run: doppler secrets download --no-file --format env --config dev >> "$GITHUB_ENV"
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_DEV }}

      # ── Start Next.js dev server in the background ────────────────────────
      # The server must be running and responding non-500 before vitest
      # executes.  We poll /api/adapt: 401 = auth gate (DB connected, server
      # healthy), 200/405 = also healthy.  500 = server started but DB not
      # reachable (missing env vars in Doppler dev config).
      - name: Start Next.js dev server
        run: pnpm --filter @estalara/control-plane dev &
        env:
          NEXT_PUBLIC_TEST_E2E: "true"
          PORT: "3000"

      - name: Wait for Next.js to be ready (health check — fail-loud)
        run: |
          echo "Waiting for Next.js on http://localhost:3000 …"
          LAST_STATUS="000"
          for i in $(seq 1 40); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/adapt || echo "000")
            LAST_STATUS="$STATUS"
            if [ "$STATUS" = "401" ] || [ "$STATUS" = "405" ] || [ "$STATUS" = "200" ]; then
              echo "Next.js ready (HTTP $STATUS) after ${i}×3 s"
              exit 0
            fi
            echo "  attempt $i/40 — HTTP $STATUS — waiting 3 s …"
            sleep 3
          done
          echo "::error title=demo-integration server not healthy::Next.js returned HTTP $LAST_STATUS after 120 s."
          echo "Likely cause: Doppler 'dev' config is missing one or more of:"
          echo "  DATABASE_URL, NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,"
          echo "  SUPABASE_SERVICE_ROLE_KEY, JWT_SECRET"
          echo "Verify the Doppler dev config contains all control-plane env vars."
          exit 1

      # ── Run the demo E2E spec ─────────────────────────────────────────────
      # NEXT_PUBLIC_TEST_E2E=true unlocks the 5 integration steps.
      # E2E_BEARER_TOKEN authenticates calls to /api/detect, /api/schema/activate,
      # and /api/adapt.  The spec's beforeAll() fails fast with an actionable error
      # if the token is absent.
      # E2E_TENANT_ID targets the demo/canary tenant seeded with DEMO_LISTING_MANIFEST
      # fixtures (FOLLOW-046 auto-seeds on activation).
      - name: Run demo integration spec
        run: pnpm --filter @estalara/e2e-smoke test:e2e tests/e2e/sprint-9-5-demo.spec.ts
        env:
          NEXT_PUBLIC_TEST_E2E: "true"
          E2E_BASE_URL: "http://localhost:3000"
          E2E_BEARER_TOKEN: ${{ secrets.E2E_BEARER_TOKEN }}
          E2E_TENANT_ID: ${{ vars.E2E_TENANT_ID || 'est_test_e2e_tenant' }}
