# Deploy Staging — a BUNDLE/UPLOAD SMOKE, not a test environment.
#
# 2026-08-07 (FOLLOW-878 / ESC-052 RESOLVED, CEO option 2): re-confirmed, no change
# to behaviour. This header was already correct after FOLLOW-810; ESC-052 only
# widened WHY. Localhost-first is now official for the data plane too, so "staging"
# is not coming later either — the Doppler `stg` config is byte-identical to `prd`
# and is retired by FOLLOW-873. This workflow injects no Doppler secrets, which is
# the only reason it is harmless to keep.
#
# The staging Workers deliberately have no reachable hostname: `[env.staging]` declares no
# KV/DO/queue bindings, and `ingest-staging.estalara.com` / `decision-staging.estalara.com`
# have no DNS record in the zone (they fall through the `*.estalara.com` wildcard to a
# non-Cloudflare host). See `docs/runbooks/INGEST_WORKER_DEPLOY.md` §3 — that is a design
# decision, not a gap.
#
# A green `Uploaded` + `Deployed` is therefore the WHOLE signal this workflow can give.
# The two HTTP smoke steps that used to live here probed those unreachable hostnames and
# swallowed the failure twice over (`curl -f … || echo …` under `continue-on-error: true`),
# so they reported success against a host that by design never answers. Removed rather than
# repointed: a step that cannot fail is not a test, and a green run that implies coverage
# it does not have is worse than no step at all. Do not re-add an HTTP probe here unless
# the staging hostnames are genuinely provisioned first.

name: Deploy Staging

on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false # Never cancel in-flight deploys

jobs:
  deploy-ingest:
    name: Deploy Ingest Worker (Staging)
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @estalara/shared build

      - name: Build ingest worker
        run: pnpm --filter @estalara/ingest build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/ingest
          command: deploy --env staging

  deploy-decision-api:
    name: Deploy Decision API Worker (Staging)
    runs-on: ubuntu-latest
    needs: deploy-ingest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build decision-api worker
        run: pnpm --filter @estalara/decision-api build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/decision-api
          command: deploy --env staging
