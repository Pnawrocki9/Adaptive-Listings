name: E2E Smoke Test

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC nightly
  workflow_dispatch:

jobs:
  smoke:
    name: ingest → clickhouse smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Start Docker services
        working-directory: tests/e2e
        run: docker compose up -d --build

      - name: Wait for ClickHouse
        run: |
          echo "Waiting for ClickHouse..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:8123/ping && echo " ClickHouse ready" && break
            echo "  attempt $i/30..."
            sleep 3
          done
          curl -sf http://localhost:8123/ping || (echo "ClickHouse never became ready" && exit 1)

      - name: Wait for Redpanda
        run: |
          echo "Waiting for Redpanda..."
          for i in $(seq 1 30); do
            docker compose -f tests/e2e/docker-compose.yml exec -T redpanda \
              rpk cluster info --brokers=redpanda:9092 2>/dev/null && \
              echo " Redpanda ready" && break
            echo "  attempt $i/30..."
            sleep 3
          done

      - name: Seed API key in wrangler local KV
        working-directory: apps/ingest
        run: |
          # `--namespace-id=PLACEHOLDER_KV_API_KEYS_PREVIEW_ID` was a literal that appeared
          # nowhere but this file — never substituted, so this step could only ever fail.
          # `--binding` resolves the id from apps/ingest/wrangler.toml, so it cannot drift
          # away from the worker's own config again. `--preview false` is then REQUIRED:
          # wrangler refuses a bare `--binding` when id and preview_id both exist
          # ("Specify --preview or --preview false to avoid writing data to the wrong
          # namespace"). Here both ids are the same string, so the choice is a formality
          # wrangler still insists on. [FOLLOW-986]
          pnpm exec wrangler kv key put \
            --local \
            --binding KV_API_KEYS \
            --preview false \
            "api_key:pk_test_smoke" \
            '{"tenant_id":"a0000000-0000-0000-0000-000000000001","scopes":["write:events"]}'
        env:
          CI: "true"
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Start wrangler dev (background)
        working-directory: apps/ingest
        run: |
          pnpm exec wrangler dev \
            --port 8787 \
            --var REDPANDA_REST_URL:http://localhost:18082 \
            --var ENVIRONMENT:e2e \
            --no-bundle=false \
            &
          echo $! > /tmp/wrangler.pid
        env:
          CI: "true"
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Wait for wrangler dev
        run: |
          echo "Waiting for wrangler dev..."
          for i in $(seq 1 40); do
            curl -sf http://localhost:8787/health && echo " wrangler dev ready" && break
            echo "  attempt $i/40..."
            sleep 2
          done
          curl -sf http://localhost:8787/health || \
            (echo "wrangler dev never became ready" && cat /tmp/wrangler.pid && exit 1)

      - name: Run E2E smoke test
        run: pnpm e2e:smoke
        env:
          INGEST_URL: http://localhost:8787
          CLICKHOUSE_URL: http://localhost:8123
          API_KEY: pk_test_smoke
          # Set only here — after "Wait for ClickHouse" / "Wait for wrangler dev" have
          # health-checked both services ready — so the smoke-ingest.test.ts assertions
          # actually run instead of soft-skipping (FOLLOW-563, CONVENTIONS_PATCH.md Rule Q).
          REQUIRE_INGEST_SMOKE: "1"

      - name: Teardown
        if: always()
        run: |
          kill "$(cat /tmp/wrangler.pid)" 2>/dev/null || true
          docker compose -f tests/e2e/docker-compose.yml down --volumes --remove-orphans

      # This step used to be `if: failure() && env.SLACK_WEBHOOK_URL != ''`, which made a
      # MISSING notification channel indistinguishable from a passing run: no Slack secret is
      # configured in this repo, so the step was `skipped` on all 103 consecutive failures and
      # nothing anywhere said so. An alarm whose silence carries zero bits is the shape this
      # estate keeps rediscovering (the mute Sentry DSN, ESC-057). It now ALWAYS runs on
      # failure and says which channel it could not reach. [FOLLOW-986]
      - name: Announce failure (Slack if configured, annotation always)
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_E2E_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sS -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\"🚨 E2E Smoke FAILED — <$RUN_URL|view run>\"}" \
              && echo "Slack notified."
          else
            echo "::error title=E2E smoke failed with NO notification channel::\
          SLACK_E2E_WEBHOOK_URL is not set, so this failure reached no human by any channel. \
          See $RUN_URL — and backlog/ESCALATIONS.md for the missing-secret escalation."
          fi
