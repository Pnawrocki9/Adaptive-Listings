name: E2E Smoke Test

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC nightly
  workflow_dispatch:

jobs:
  smoke:
    name: ingest → clickhouse smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      # `pnpm install` does NOT build workspace packages, and apps/ingest resolves
      # `@estalara/shared` through its built `dist` (see its package.json `main`/`exports`).
      # Without this, `wrangler dev` starts, prints "Ready on http://localhost:8787", and then
      # its esbuild pass fails with `Could not resolve "@estalara/shared"` — so the health
      # check polls a server that answers nothing for 80s. Same filter shape ci.yml already
      # uses for the jobs that consume packages/*. [FOLLOW-986]
      - name: Build workspace packages (ingest resolves @estalara/shared via dist)
        run: pnpm turbo run build --filter='./packages/*'

      - name: Start Docker services
        working-directory: tests/e2e
        run: docker compose up -d --build

      - name: Wait for ClickHouse
        run: |
          echo "Waiting for ClickHouse..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:8123/ping && echo " ClickHouse ready" && break
            echo "  attempt $i/30..."
            sleep 3
          done
          curl -sf http://localhost:8123/ping || (echo "ClickHouse never became ready" && exit 1)

      - name: Wait for Redpanda
        run: |
          echo "Waiting for Redpanda..."
          for i in $(seq 1 30); do
            docker compose -f tests/e2e/docker-compose.yml exec -T redpanda \
              rpk cluster info --brokers=redpanda:9092 2>/dev/null && \
              echo " Redpanda ready" && break
            echo "  attempt $i/30..."
            sleep 3
          done

      - name: Seed API key in wrangler local KV
        working-directory: apps/ingest
        run: |
          # `--namespace-id=PLACEHOLDER_KV_API_KEYS_PREVIEW_ID` was a literal that appeared
          # nowhere but this file — never substituted, so this step could only ever fail.
          # `--binding` resolves the id from apps/ingest/wrangler.toml, so it cannot drift
          # away from the worker's own config again. `--preview false` is then REQUIRED:
          # wrangler refuses a bare `--binding` when id and preview_id both exist
          # ("Specify --preview or --preview false to avoid writing data to the wrong
          # namespace"). Here both ids are the same string, so the choice is a formality
          # wrangler still insists on. [FOLLOW-986]
          pnpm exec wrangler kv key put \
            --local \
            --binding KV_API_KEYS \
            --preview false \
            "api_key:pk_test_smoke" \
            '{"tenant_id":"a0000000-0000-0000-0000-000000000001","scopes":["write:events"]}'
        env:
          CI: "true"
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # This step used to pass `--var REDPANDA_REST_URL:http://localhost:18082`, which
      # OVERRODE wrangler.toml's own documented default of `""` in order to force ON a hop
      # this estate retired in May 2026:
      #
      #   * ESC-017 (RESOLVED 2026-05-29, PR #170) — Redpanda Cloud Serverless exposes NO
      #     Pandaproxy (HTTP Proxy is BYOC/Dedicated only), so the Worker could never publish
      #     there. Replaced by the direct Worker → ClickHouse HTTPS write in
      #     `clickhouse-producer.ts`. wrangler.toml says so at the `REDPANDA_REST_URL` var.
      #   * ADR-0016 (Accepted 2026-07-03) — removed Redpanda from the description and
      #     embed-seed flows too, in favour of direct authenticated Modal HTTPS endpoints.
      #
      # So the smoke test was exercising a retired topology while NEVER exercising the path
      # that actually ships: `CLICKHOUSE_URL` was passed to the test process but never to the
      # Worker, so its direct-write path sat behind its own no-cred guard the whole time. And
      # a Redpanda publish failure is FATAL to the request (503 `redpanda_unavailable`,
      # events.ts:626-632), so the dead hop could take down a request the live path would have
      # served. Now: Redpanda falls back to wrangler.toml's `""` (no-bus guard) and the Worker
      # gets the ClickHouse URL, so this asserts the pipeline as shipped. [FOLLOW-986]
      #
      # NOT decided here: whether the redpanda + stream-consumer containers should leave
      # docker-compose.yml entirely. ADR-0016 explicitly deferred the ingest-mirror question
      # ("a follow-up decides whether to route those directly to ClickHouse or reinstate a bus
      # at scale") and that follow-up was never written. Left running, unused.
      - name: Start wrangler dev (background)
        working-directory: apps/ingest
        run: |
          pnpm exec wrangler dev \
            --port 8787 \
            --var CLICKHOUSE_URL:http://localhost:8123 \
            --var CLICKHOUSE_DATABASE:default \
            --var ENVIRONMENT:e2e \
            --no-bundle=false \
            > /tmp/wrangler.log 2>&1 &
          echo $! > /tmp/wrangler.pid
        env:
          CI: "true"
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Wait for wrangler dev
        run: |
          echo "Waiting for wrangler dev..."
          for i in $(seq 1 40); do
            curl -sf http://localhost:8787/health && echo " wrangler dev ready" && break
            echo "  attempt $i/40..."
            sleep 2
          done
          curl -sf http://localhost:8787/health || \
            (echo "wrangler dev never became ready" && cat /tmp/wrangler.pid && exit 1)

      - name: Run E2E smoke test
        run: pnpm e2e:smoke
        env:
          INGEST_URL: http://localhost:8787
          CLICKHOUSE_URL: http://localhost:8123
          API_KEY: pk_test_smoke
          # Set only here — after "Wait for ClickHouse" / "Wait for wrangler dev" have
          # health-checked both services ready — so the smoke-ingest.test.ts assertions
          # actually run instead of soft-skipping (FOLLOW-563, CONVENTIONS_PATCH.md Rule Q).
          REQUIRE_INGEST_SMOKE: "1"

      # Without this the Worker's own stdout is unreachable: `wrangler dev` is backgrounded,
      # the step that starts it exits immediately, and every later diagnosis has to guess.
      # That is why a 200-ACK with zero rows in ClickHouse could not be attributed to the
      # writer, its credentials or its post-ACK lifecycle. [FOLLOW-986]
      - name: Dump wrangler dev log on failure
        if: failure()
        run: |
          echo "===== /tmp/wrangler.log ====="
          cat /tmp/wrangler.log 2>/dev/null || echo "(no wrangler log captured)"
          echo "===== ClickHouse events count ====="
          curl -sf "http://localhost:8123/?query=SELECT+count()+FROM+default.events" || true
          # Ask the SERVER where the INSERT went, rather than inferring it. `written_rows: 50` in
          # the worker log with `count() = 0` here is a contradiction that only query_log can
          # resolve: it records the database, the table and the row count of every statement, so
          # "wrote 50 somewhere else" and "wrote 50 nowhere" stop looking identical. [FOLLOW-986]
          echo "===== databases ====="
          curl -sf "http://localhost:8123/?query=SHOW+DATABASES" || true
          echo "===== tables named events ====="
          curl -sf "http://localhost:8123/?query=SELECT+database,name,engine+FROM+system.tables+WHERE+name='events'+FORMAT+TSV" || true
          echo "===== INSERTs the server actually executed ====="
          curl -sf "http://localhost:8123/?query=SYSTEM+FLUSH+LOGS" || true
          curl -sf "http://localhost:8123/?query=SELECT+event_time,type,written_rows,tables,exception+FROM+system.query_log+WHERE+query_kind='Insert'+ORDER+BY+event_time+DESC+LIMIT+5+FORMAT+TSV" || true

      - name: Teardown
        if: always()
        run: |
          kill "$(cat /tmp/wrangler.pid)" 2>/dev/null || true
          docker compose -f tests/e2e/docker-compose.yml down --volumes --remove-orphans

      # This step used to be `if: failure() && env.SLACK_WEBHOOK_URL != ''`, which made a
      # MISSING notification channel indistinguishable from a passing run: no Slack secret is
      # configured in this repo, so the step was `skipped` on all 103 consecutive failures and
      # nothing anywhere said so. An alarm whose silence carries zero bits is the shape this
      # estate keeps rediscovering (the mute Sentry DSN, ESC-057). It now ALWAYS runs on
      # failure and says which channel it could not reach. [FOLLOW-986]
      - name: Announce failure (Slack if configured, annotation always)
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_E2E_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sS -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\"🚨 E2E Smoke FAILED — <$RUN_URL|view run>\"}" \
              && echo "Slack notified."
          else
            echo "::error title=E2E smoke failed with NO notification channel::\
          SLACK_E2E_WEBHOOK_URL is not set, so this failure reached no human by any channel. \
          See $RUN_URL — and backlog/ESCALATIONS.md for the missing-secret escalation."
          fi
