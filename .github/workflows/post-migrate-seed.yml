# post-migrate-seed.yml
#
# Runs automatically on every push to main. Checks whether any
# `archetype_embeddings` rows still have NULL embeddings and, if so, runs
# `pnpm seed:archetypes` to populate them.
#
# Design notes:
#   - Idempotent: the seed script is a no-op when all rows are already
#     populated (exits 0 with "nothing to seed" log).
#   - Soft-skip when DOPPLER_TOKEN is unavailable: if DOPPLER_TOKEN_DEV is not
#     provisioned, the `doppler-check` step sets skip=true and the seed step's
#     `if:` keeps it from running, so the job is green with a clear log line.
#     That `if:` is the WHOLE soft-skip.
#
#     FOLLOW-1191 / audit finding E-1: this used to be a JOB-level
#     `continue-on-error: true`, which scopes to nothing — it swallowed a real
#     failure just as happily. The seed step failed on EVERY run GitHub still
#     retained (a `.mts`→`.ts` named-import SyntaxError, ~11 weeks) while the
#     workflow reported `success` 200 times running. A genuine seed failure now
#     turns this job red.
#   - Does NOT run on pull_request events — it requires a real DB
#     (CORRECTED 2026-08-07, FOLLOW-878 / ESC-052: this read "real staging DB".
#      There is no staging DB. Doppler `stg` was byte-identical to `prd`, so the
#      only real DB this job can reach is PRODUCTION.)
#     credentials and a real OPENAI_API_KEY, which must not be exposed on
#     untrusted forks.
#   - The manual workflow_dispatch entry in seed-archetypes.yml is retained as
#     the operator override.

name: Post-migrate seed archetype embeddings

on:
  push:
    branches:
      - main

jobs:
  seed-archetypes:
    name: Seed archetype embeddings (if any NULL)
    runs-on: ubuntu-latest
    # The missing-DOPPLER_TOKEN_DEV soft-skip is the `if:` on the seed step
    # below, NOT a job-level continue-on-error (FOLLOW-1191 / E-1).
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @estalara/shared
        run: pnpm --filter @estalara/shared build

      - name: Build @estalara/db
        run: pnpm --filter @estalara/db build

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Check if DOPPLER_TOKEN_DEV is available
        id: doppler-check
        run: |
          if [ -z "$DOPPLER_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "[post-migrate-seed] DOPPLER_TOKEN_DEV not set — skipping seed step."
            echo "Set the DOPPLER_TOKEN_DEV GitHub Actions secret once FOLLOW-040 lands."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_DEV }}

      - name: Detect archetype description changes
        id: desc-check
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -q 'packages/db/src/seed/archetype-seeds.ts'; then
            echo "force_reseed=true" >> "$GITHUB_OUTPUT"
            echo "[post-migrate-seed] archetype-seeds.ts changed — will force-reseed all embeddings."
          else
            echo "force_reseed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Seed archetype embeddings (idempotent; force on description change)
        if: steps.doppler-check.outputs.skip == 'false'
        run: doppler run --config dev -- pnpm seed:archetypes
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_DEV }}
          FORCE_RESEED: ${{ steps.desc-check.outputs.force_reseed }}
