name: Redis shadow round-trip smoke (FOLLOW-368, FOLLOW-752)

# Proves the Python write_shadow_intent writer and the TypeScript
# readShadowChatIntent reader share ONE Upstash Redis instance (env-var
# parity), AND (FOLLOW-752) that the `SET … NX` write-admission invariant
# (ADR-0020 D3/D4) is honoured by that REAL instance, not just passed as a
# kwarg to a mock. Runs on every push/PR for all agent-prefixed branches and
# on a nightly schedule.
#
# Skip-loud contract (mirrors intent-weights-live-smoke / RETRO-007):
#   secrets absent → soft-skip with ::notice:: in the spec output (safe for
#     offline dev and forked PRs — no false-red from missing secrets).
#   REQUIRE_REDIS_SMOKE=1 + any secret absent → spec throws (hard-fail).
#   All secrets present + round-trip broken → assertion fails (hard-fail).
#
# ESC-028 RESOLVED 2026-07-13: all four secrets are provisioned as GitHub
# Actions secrets against the shared test Upstash instance, so this job runs
# in hard-fail mode (REQUIRE_REDIS_SMOKE=1) on every push/PR, not soft-skip.
#
# Required secrets (all four must point at the SAME Upstash instance):
#   UPSTASH_REDIS_REST_URL   — Upstash REST endpoint (Python writer side)
#   UPSTASH_REDIS_REST_TOKEN — Upstash REST token    (Python writer side)
#   UPSTASH_REDIS_URL        — Upstash REST endpoint (TS reader side)
#   UPSTASH_REDIS_TOKEN      — Upstash REST token    (TS reader side)
#
# FOLLOW-761: `push` (agent branches) + `pull_request` fire two runs of this
# workflow on the SAME commit (measured 34s apart, smoke windows overlapping
# 26s — RETRO-238 §4a LG-1). The `concurrency` group below serializes runs
# that share a branch so they never race the SAME Upstash instance; the
# per-run key namespacing in the spec (github.run_id) is belt-and-braces so
# the guarantee does not rest on scheduling alone (two DIFFERENT branches'
# runs are NOT in the same group and can still be genuinely concurrent).

on:
  push:
    branches:
      - main
      - "devops-engineer/**"
      - "backend-engineer/**"
      - "sdk-engineer/**"
      - "data-engineer/**"
      - "ml-engineer/**"
      - "qa-engineer/**"
      - "compliance-engineer/**"
      - "architect/**"
      - "pm-orchestrator/**"
  pull_request:
    branches:
      - main
  schedule:
    # Nightly at 04:30 UTC — production canary run
    - cron: "30 4 * * *"
  workflow_dispatch:

# FOLLOW-761: group by the branch identity shared between `push` and
# `pull_request` events (`head_ref` is only set for `pull_request`; `ref_name`
# covers `push`/`schedule`/`workflow_dispatch`) so the two duplicate triggers
# for one agent branch's commit queue behind each other instead of racing the
# same Upstash instance. `cancel-in-progress: false` — a cancelled mid-flight
# run would abandon its fixture keys in the shared instance rather than
# cleaning them up (see the spec's `afterAll`), which is the failure mode to
# avoid, so the second run WAITS rather than pre-empting the first.
#
# The nightly cron (`schedule`, ref_name=main) is IN this group: it shares
# `redis-shadow-smoke-main` with any push/PR-merge run on `main`, which is the
# desired behaviour (the cron is a third writer against the same instance and
# should not race a same-ref run either). It is NOT serialized against
# feature-branch runs, which use their own branch-scoped group — those are
# covered by the run_id key-namespacing in the spec instead.
concurrency:
  group: redis-shadow-smoke-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  redis-shadow-smoke:
    name: Redis shadow round-trip (write_shadow_intent → readShadowChatIntent)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # ── Python setup (needed for the write side) ─────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install intent-engine Python deps
        working-directory: apps/intent-engine
        run: pip install -e ".[dev]"

      # ── Node/pnpm setup (needed for the TS read side) ────────────────────
      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @estalara/shared (transitive SDK dependency)
        run: pnpm --filter @estalara/shared build

      # ── Secret availability check ─────────────────────────────────────────
      # Announce soft-skip when secrets are absent (forked PRs, not-yet-provisioned).
      # When ALL four secrets ARE present, set REQUIRE_REDIS_SMOKE=1 so the spec
      # hard-fails on a broken wire instead of soft-skipping.
      - name: Check secret availability
        id: secret-check
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          UPSTASH_REDIS_TOKEN: ${{ secrets.UPSTASH_REDIS_TOKEN }}
        run: |
          if [ -z "${UPSTASH_REDIS_REST_URL}" ] || [ -z "${UPSTASH_REDIS_REST_TOKEN}" ] || \
             [ -z "${UPSTASH_REDIS_URL}" ] || [ -z "${UPSTASH_REDIS_TOKEN}" ]; then
            echo "::notice::One or more UPSTASH_REDIS_* secrets are not set — FOLLOW-368 Redis round-trip smoke will soft-skip. Provision all four secrets per backlog/ESCALATIONS.md ESC-028 to enable live assertions."
            echo "secrets_present=false" >> "$GITHUB_OUTPUT"
          else
            echo "secrets_present=true" >> "$GITHUB_OUTPUT"
          fi

      # ── Run the round-trip smoke ─────────────────────────────────────────
      - name: Run Redis shadow round-trip smoke
        working-directory: tests/integration
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          UPSTASH_REDIS_TOKEN: ${{ secrets.UPSTASH_REDIS_TOKEN }}
          # Set REQUIRE_REDIS_SMOKE=1 only when all four secrets are present so
          # a broken endpoint fails loud rather than silently skipping.
          REQUIRE_REDIS_SMOKE: >-
            ${{ steps.secret-check.outputs.secrets_present == 'true' && '1' || '' }}
          # FOLLOW-761: namespaces the NX_WARM_*/NX_COLD_* fixture keys per run
          # (belt-and-braces alongside the concurrency group above — see the
          # spec for how this is threaded into the fixture key names and into
          # nx_invariant_writer.py's argv). github.run_id is unique per
          # workflow run, so two runs against the same instance can never
          # share a fixture key even if they execute genuinely concurrently.
          NX_RUN_SUFFIX: ${{ github.run_id }}
        run: pnpm exec vitest run --config vitest.config.ts redis-shadow-round-trip.smoke
