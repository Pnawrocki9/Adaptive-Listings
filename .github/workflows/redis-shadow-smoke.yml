name: Redis shadow round-trip smoke (FOLLOW-368, FOLLOW-752)

# Proves the Python write_shadow_intent writer and the TypeScript
# readShadowChatIntent reader share ONE Upstash Redis instance (env-var
# parity), AND (FOLLOW-752) that the `SET … NX` write-admission invariant
# (ADR-0020 D3/D4) is honoured by that REAL instance, not just passed as a
# kwarg to a mock. Runs on every push/PR for all agent-prefixed branches and
# on a nightly schedule.
#
# Hard-fail contract is a function of TRIGGER TYPE, not of whether secrets
# currently happen to be present (FOLLOW-762 — RETRO-238 §4a LG-2; Rule Q's
# "soft-skip must be scoped to the ONE intended condition" clause):
#   push / schedule / workflow_dispatch / same-repo pull_request →
#     REQUIRE_REDIS_SMOKE=1 UNCONDITIONALLY. A missing/rotated/revoked secret
#     on any of these trusted triggers is a hard CI failure (the spec throws
#     — see redis-shadow-round-trip.smoke.test.ts), never a silent skip.
#   pull_request from a FORK → soft-skip with ::notice:: in the spec output.
#     This is the ONE legitimate skip condition: GitHub Actions does not
#     expose repository secrets to fork-originated workflow runs by design,
#     so there is no way for a fork PR to supply them.
#   All secrets present + round-trip broken → assertion fails (hard-fail),
#     on any trigger.
#
# The "Negative control" step below proves the REQUIRE_REDIS_SMOKE=1 +
# missing-secret throw actually fires in CI (Rule Q clause 4) — it is not an
# untested claim. ESC-028 (secret provisioning) was RESOLVED 2026-07-13; see
# backlog/ESCALATIONS.md.
#
# Required secrets (all four must point at the SAME Upstash instance):
#   UPSTASH_REDIS_REST_URL   — Upstash REST endpoint (Python writer side)
#   UPSTASH_REDIS_REST_TOKEN — Upstash REST token    (Python writer side)
#   UPSTASH_REDIS_URL        — Upstash REST endpoint (TS reader side)
#   UPSTASH_REDIS_TOKEN      — Upstash REST token    (TS reader side)
#
# FOLLOW-761: `push` (agent branches) + `pull_request` fire two runs of this
# workflow on the SAME commit (measured 34s apart, smoke windows overlapping
# 26s — RETRO-238 §4a LG-1). The `concurrency` group below serializes runs
# that share a branch so they never race the SAME Upstash instance; the
# per-run key namespacing in the spec (github.run_id) is belt-and-braces so
# the guarantee does not rest on scheduling alone (two DIFFERENT branches'
# runs are NOT in the same group and can still be genuinely concurrent).

on:
  push:
    branches:
      - main
      - "devops-engineer/**"
      - "backend-engineer/**"
      - "sdk-engineer/**"
      - "data-engineer/**"
      - "ml-engineer/**"
      - "qa-engineer/**"
      - "compliance-engineer/**"
      - "architect/**"
      - "pm-orchestrator/**"
  pull_request:
    branches:
      - main
  schedule:
    # Nightly at 04:30 UTC — production canary run
    - cron: "30 4 * * *"
  workflow_dispatch:

# FOLLOW-761: group by the branch identity shared between `push` and
# `pull_request` events (`head_ref` is only set for `pull_request`; `ref_name`
# covers `push`/`schedule`/`workflow_dispatch`) so the two duplicate triggers
# for one agent branch's commit queue behind each other instead of racing the
# same Upstash instance. `cancel-in-progress: false` protects only the
# RUNNING job in a group from pre-emption — it does NOT protect a PENDING
# (queued-behind-it) run. GitHub Actions' documented `queue: single` default
# allows at most one PENDING run per group, and a THIRD run arriving while a
# second is still pending CANCELS that pending run outright and takes its
# place — this is documented GitHub behaviour ("any existing pending job or
# workflow in the same concurrency group will be canceled and the new queued
# job or workflow will take its place"), and FOLLOW-773 AC1 reproduced it
# empirically against this exact `redis-shadow-smoke-main` group: three
# `workflow_dispatch` runs queued seconds apart on 2026-08-03 (run
# `30812441374`, in_progress; run `30812458311`, went `pending` then
# `cancelled` the instant a third run was queued; run `30812477744`, the new
# `pending` run that replaced it). On a bare `main` push there is no PR check
# and no human watcher — a cancelled middle run produces NO verdict at all for
# a merged commit, silently (RETRO-241 §4a LG-1, the finding this comment used
# to understate).
#
# FOLLOW-773 remedy (chosen over the other two named in the ticket): a `push`
# on `main` keys its group on `github.run_id` instead of branch identity, so a
# main-line run can never have another run queued into ITS group and
# therefore can never become the pending run that gets cancelled. This is
# free: NX_RUN_SUFFIX (the spec's per-run fixture-key namespace, threaded
# through below) already makes every run's Upstash keys disjoint by
# construction (FOLLOW-761 AC3) — the concurrency group was never load-bearing
# for correctness, only for reducing duplicate-run CI spend on feature
# branches. Rejected: (a) dropping only the cron out of the group would leave
# the OTHER two `main` members — the two push-driven runs themselves — still
# able to race each other into this exact cancellation hole; (c) keeping the
# shared group and adding a cancellation-detection step makes a lost verdict
# visible but does not restore it — a `main`-push cancellation would still be
# a result nobody reads by default, only now with an extra unread annotation.
#
# The nightly cron (`schedule`, ref_name=main) is NOT a `push`, so it falls
# through to the literal `redis-shadow-smoke-main` group below. Because every
# `main`-line push now uses its own unique run-id group, nothing else ever
# lands in that literal string either — the cron effectively runs alone, which
# is correct (it fires once daily and cannot race itself).
#
# Feature-branch push/pull_request pairs (any branch other than `main`) still
# share the plain branch-identity group and are NOT covered by this remedy —
# the same theoretical last-pending-run-cancellation risk remains there in
# principle. It is lower-severity there (a feature branch's `pull_request` run
# has a PR check a human is expected to watch, unlike a bare `main` push) and
# is not the case RETRO-241 measured or FOLLOW-773 was scoped to fix. Not
# filed as a further ticket here — recorded so a future reader does not assume
# this remedy is complete for every branch shape.
concurrency:
  group: ${{ (github.event_name == 'push' && github.ref_name == 'main') && format('redis-shadow-smoke-main-run-{0}', github.run_id) || format('redis-shadow-smoke-{0}', github.head_ref || github.ref_name) }}
  cancel-in-progress: false

jobs:
  redis-shadow-smoke:
    name: Redis shadow round-trip (write_shadow_intent → readShadowChatIntent)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── FOLLOW-773 AC4: proof-of-effect for the concurrency group above ──
      # Prints the ACTUAL resolved group-name expression (not the literal
      # string in the YAML) so a typo'd or constant-folded expression is
      # visible in the log rather than silently wrong. This expression MUST
      # be kept byte-identical to `concurrency.group` above.
      - name: "Proof-of-effect: print the resolved concurrency group (FOLLOW-773 AC4)"
        run: |
          echo "Resolved concurrency group for this run: ${{ (github.event_name == 'push' && github.ref_name == 'main') && format('redis-shadow-smoke-main-run-{0}', github.run_id) || format('redis-shadow-smoke-{0}', github.head_ref || github.ref_name) }}"

      - uses: actions/checkout@v4

      # ── FOLLOW-774 AC2: trigger-trust decision self-test ──────────────────
      # Runs the case-table + mutation-divergence self-test from
      # scripts/check-redis-smoke-trigger-trust.sh on EVERY invocation of this
      # workflow (push/PR/schedule/workflow_dispatch alike) — not just
      # locally — so "an inverted fork predicate turns something RED" is
      # proven on an automated path, not merely asserted. See the script's
      # own header for why a reachability fixture ("the branch exists") was
      # not sufficient.
      - name: "Self-test: trigger-trust decision case table (FOLLOW-774 AC2)"
        run: bash scripts/check-redis-smoke-trigger-trust.sh --self-test

      # ── Python setup (needed for the write side) ─────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install intent-engine Python deps
        working-directory: apps/intent-engine
        run: pip install -e ".[dev]"

      # ── Node/pnpm setup (needed for the TS read side) ────────────────────
      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @estalara/shared (transitive SDK dependency)
        run: pnpm --filter @estalara/shared build

      # ── Trigger-trust + secret availability check ─────────────────────────
      # REQUIRE_REDIS_SMOKE is a function of TRIGGER TYPE (FOLLOW-762): every
      # trigger except a fork-originated pull_request is trusted and MUST
      # hard-fail on a missing secret, not skip. A fork PR is the one
      # legitimate soft-skip condition, because GitHub Actions withholds
      # repository secrets from fork-originated runs by design.
      - name: Check trigger trust + secret availability
        id: secret-check
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          UPSTASH_REDIS_TOKEN: ${{ secrets.UPSTASH_REDIS_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          IS_FORKED_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true }}
        run: |
          # FOLLOW-774 AC2: source the SAME function the self-test step above
          # exercised, so production and self-test share one code path.
          source scripts/check-redis-smoke-trigger-trust.sh

          if [ -z "${UPSTASH_REDIS_REST_URL}" ] || [ -z "${UPSTASH_REDIS_REST_TOKEN}" ] || \
             [ -z "${UPSTASH_REDIS_URL}" ] || [ -z "${UPSTASH_REDIS_TOKEN}" ]; then
            SECRETS_PRESENT=false
          else
            SECRETS_PRESENT=true
          fi
          echo "secrets_present=${SECRETS_PRESENT}" >> "$GITHUB_OUTPUT"

          HARD_FAIL_REQUIRED="$(compute_hard_fail_required "${EVENT_NAME}" "${IS_FORKED_PR}")"
          echo "hard_fail_required=${HARD_FAIL_REQUIRED}" >> "$GITHUB_OUTPUT"

          if [ "${HARD_FAIL_REQUIRED}" = "false" ]; then
            if [ "${SECRETS_PRESENT}" = "false" ]; then
              echo "::notice::Forked PR — UPSTASH_REDIS_* secrets are not exposed to fork-originated workflow runs by GitHub Actions design, so this is the ONE legitimate soft-skip condition (Rule Q / FOLLOW-762). FOLLOW-368/752 Redis round-trip smoke will soft-skip; see its own ::notice:: below."
            fi
          else
            if [ "${SECRETS_PRESENT}" = "false" ]; then
              echo "::warning::Trusted trigger (push, schedule, workflow_dispatch, or same-repo pull_request) but one or more UPSTASH_REDIS_* secrets are absent. REQUIRE_REDIS_SMOKE=1 is set regardless — the spec below MUST hard-fail rather than skip. Provision all four secrets; see docs/runbooks/upstash-redis-env-parity.md."
            fi
          fi

      # ── Run the round-trip smoke ─────────────────────────────────────────
      - name: Run Redis shadow round-trip smoke
        working-directory: tests/integration
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          UPSTASH_REDIS_TOKEN: ${{ secrets.UPSTASH_REDIS_TOKEN }}
          # Unconditional 1 on every trusted trigger (hard_fail_required=true);
          # on a forked PR, only '1' if the (normally-absent) secrets happen to
          # be present. See the "Check trigger trust" step above — FOLLOW-762.
          REQUIRE_REDIS_SMOKE: >-
            ${{ steps.secret-check.outputs.hard_fail_required == 'true' && '1' || (steps.secret-check.outputs.secrets_present == 'true' && '1' || '') }}
          # FOLLOW-761: namespaces the NX_WARM_*/NX_COLD_* fixture keys per run
          # (belt-and-braces alongside the concurrency group above — see the
          # spec for how this is threaded into the fixture key names and into
          # nx_invariant_writer.py's argv). github.run_id is unique per
          # workflow run, so two runs against the same instance can never
          # share a fixture key even if they execute genuinely concurrently.
          NX_RUN_SUFFIX: ${{ github.run_id }}
        run: pnpm exec vitest run --config vitest.config.ts redis-shadow-round-trip.smoke

      # ── Negative control (FOLLOW-762, Rule Q clause 4) ────────────────────
      # Proves the REQUIRE_REDIS_SMOKE=1 + missing-secret hard-fail throw in
      # redis-shadow-round-trip.smoke.test.ts actually fires — a guarantee
      # that has never executed in CI is a claim, not a control. Runs
      # unconditionally (every trigger, `if: always()`) with one secret
      # deliberately blanked; independent of whether the main step above
      # passed, failed, or ran with real or absent repo secrets.
      - name: "Negative control: hard-fail throw fires on a blanked secret"
        id: negative-control
        if: always()
        continue-on-error: true
        working-directory: tests/integration
        env:
          UPSTASH_REDIS_REST_URL: "https://negative-control.invalid"
          UPSTASH_REDIS_REST_TOKEN: "negative-control-fake-token"
          UPSTASH_REDIS_URL: "https://negative-control.invalid"
          UPSTASH_REDIS_TOKEN: "" # deliberately blanked — the missing secret under test
          REQUIRE_REDIS_SMOKE: "1"
          # FOLLOW-774 AC1: this invocation gets ITS OWN namespace, distinct
          # from the main step's `${{ github.run_id }}` above. There is no
          # job-level or workflow-level `env:` NX_RUN_SUFFIX to inherit, so
          # without this the negative control would run with
          # NX_RUN_SUFFIX='local-dev' (the fixed fallback shared with every
          # developer's machine — redis-shadow-round-trip.smoke.test.ts:312).
          # Harmless today only because the module-scope credential guard
          # throws before any fixture key is touched (RETRO-241 §4a LG-2) —
          # this makes that safety structural instead of resting on another
          # ticket's unstated behaviour. Rejected alternative: leave it
          # un-namespaced, documented as safe-because-the-guard-throws — the
          # one-line fix is cheaper than an implicit cross-ticket coupling
          # nobody involved in either PR could see (RETRO-241 §8).
          NX_RUN_SUFFIX: ${{ github.run_id }}-negctl
        run: |
          set +e
          pnpm exec vitest run --config vitest.config.ts redis-shadow-round-trip.smoke > /tmp/negative-control.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/negative-control.log

      - name: "Assert negative control failed with the expected message"
        if: always()
        run: |
          EXIT_CODE="${{ steps.negative-control.outputs.exit_code }}"
          if [ -z "${EXIT_CODE}" ]; then
            echo "::error::Negative control step did not run (an earlier setup step must have failed) — cannot prove the hard-fail throw fires."
            exit 1
          fi
          if [ "${EXIT_CODE}" = "0" ]; then
            echo "::error::Negative control MUST fail — REQUIRE_REDIS_SMOKE=1 with UPSTASH_REDIS_TOKEN blanked should throw, but vitest exited 0. The gate is inert."
            exit 1
          fi
          if ! grep -q "REQUIRE_REDIS_SMOKE=1 is set but the following secrets are absent" /tmp/negative-control.log; then
            echo "::error::Negative control failed but NOT with the expected 'secrets are absent' message — investigate before trusting this gate."
            exit 1
          fi
          if ! grep -q "UPSTASH_REDIS_TOKEN" /tmp/negative-control.log; then
            echo "::error::Expected the missing-secret message to name UPSTASH_REDIS_TOKEN specifically."
            exit 1
          fi
          echo "PASS: negative control proved the REQUIRE_REDIS_SMOKE=1 hard-fail throw fires (exit ${EXIT_CODE}) with the expected message."
