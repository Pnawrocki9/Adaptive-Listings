name: Seed archetype embeddings

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "packages/db/src/seed/archetype-seeds.ts"

jobs:
  seed:
    name: Seed archetype embedding vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @estalara/db
        run: pnpm --filter @estalara/db build

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Seed archetype embeddings
        run: doppler run --config dev -- pnpm seed:archetypes
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_DEV }}

      - name: Assert no NULL embeddings in archetype_embeddings
        run: |
          doppler run --config dev -- node --input-type=module <<'EOF'
          import { createAdminClient } from '@estalara/db';
          import { isNull } from 'drizzle-orm';
          import { archetypeEmbeddings } from '@estalara/db';

          const db = createAdminClient();
          const nullRows = await db
            .select({ archetypeName: archetypeEmbeddings.archetypeName })
            .from(archetypeEmbeddings)
            .where(isNull(archetypeEmbeddings.embedding));

          if (nullRows.length > 0) {
            const names = nullRows.map(r => r.archetypeName).join(', ');
            console.error(
              `[archetype-embeddings-not-null] FAIL: ${nullRows.length} archetype(s) have NULL embedding: ${names}`
            );
            process.exit(1);
          }
          console.log(`[archetype-embeddings-not-null] PASS: all archetype embeddings populated.`);
          EOF
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_DEV }}
