name: Seed archetype embeddings

on:
  workflow_dispatch:

jobs:
  seed:
    name: Seed archetype embedding vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @estalara/db
        run: pnpm --filter @estalara/db build

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Seed archetype embeddings
        run: doppler run --config dev -- pnpm seed:archetypes
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_DEV }}
