# Gitleaks configuration for Estalara Adaptive Listings
# Prevents common API keys, credentials, and secrets from being committed
# Documentation: https://github.com/gitleaks/gitleaks

[extend]
# Use default gitleaks rules as base
useDefault = true

# AWS Access Key ID
[[rules]]
id = "aws-access-key"
description = "AWS Access Key ID"
regex = '''(?i)(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'''
tags = ["aws", "key"]

# AWS Secret Access Key
[[rules]]
id = "aws-secret-key"
description = "AWS Secret Access Key"
regex = '''(?i)aws(.{0,20})?(?-i)['\"][0-9a-zA-Z\/+]{40}['\"]'''
tags = ["aws", "secret"]

# Anthropic API Key (Claude)
[[rules]]
id = "anthropic-api-key"
description = "Anthropic API Key"
regex = '''sk-ant-api03-[a-zA-Z0-9\-_]{95}'''
tags = ["anthropic", "api-key", "claude"]

# OpenAI API Key (project-scoped)
[[rules]]
id = "openai-api-key-project"
description = "OpenAI API Key (project-scoped)"
regex = '''sk-proj-[a-zA-Z0-9]{48,}'''
tags = ["openai", "api-key"]

# OpenAI API Key (legacy)
[[rules]]
id = "openai-api-key-legacy"
description = "OpenAI API Key (legacy format)"
regex = '''sk-[a-zA-Z0-9]{48}'''
tags = ["openai", "api-key"]

# Stripe Secret Key (live)
[[rules]]
id = "stripe-secret-key-live"
description = "Stripe Secret Key (live)"
regex = '''sk_live_[0-9a-zA-Z]{24,99}'''
tags = ["stripe", "secret", "live"]

# Stripe Secret Key (test) - warning only
[[rules]]
id = "stripe-secret-key-test"
description = "Stripe Secret Key (test)"
regex = '''sk_test_[0-9a-zA-Z]{24,99}'''
tags = ["stripe", "secret", "test"]

# Stripe Restricted Key (live)
[[rules]]
id = "stripe-restricted-key-live"
description = "Stripe Restricted Key (live)"
regex = '''rk_live_[0-9a-zA-Z]{24,99}'''
tags = ["stripe", "restricted", "live"]

# Doppler Token
[[rules]]
id = "doppler-token"
description = "Doppler Service Token"
regex = '''dp\.st\.[a-zA-Z0-9]{43}'''
tags = ["doppler", "token"]

# Generic high-entropy strings (passwords, tokens)
[[rules]]
id = "generic-high-entropy"
description = "Generic high-entropy string (possible secret)"
regex = '''(?i)(password|passwd|pwd|secret|token|api[_-]?key|apikey|access[_-]?token)['"\s:=]+[a-zA-Z0-9+/=]{32,}'''
entropy = 4.5
tags = ["generic", "high-entropy"]

# Private keys (RSA, EC, etc.)
[[rules]]
id = "private-key"
description = "Private key"
regex = '''-----BEGIN\s+(RSA|DSA|EC|OPENSSH|PGP)\s+PRIVATE KEY-----'''
tags = ["private-key"]

# GCP Service Account JSON
[[rules]]
id = "gcp-service-account"
description = "GCP Service Account JSON"
regex = '''"type":\s*"service_account"'''
tags = ["gcp", "service-account"]

# Database connection strings
[[rules]]
id = "database-connection-string"
description = "Database connection string with password"
regex = '''(?i)(postgres|mysql|mongodb|redis)://[a-zA-Z0-9]+:[a-zA-Z0-9]+@'''
tags = ["database", "connection-string"]

# Supabase keys (anon key is OK, service_role is NOT)
[[rules]]
id = "supabase-service-role-key"
description = "Supabase service_role key (should never be in client code)"
regex = '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.[a-zA-Z0-9_-]+\.[a-zA-Z0-9_-]+'''
[rules.allowlist]
description = "Allow anon keys (start with 'eyJ...' but we filter via context)"
regexes = [
  '''anonKey''', # Anon keys are safe for client
]

# GitHub Personal Access Token
[[rules]]
id = "github-pat"
description = "GitHub Personal Access Token"
regex = '''ghp_[a-zA-Z0-9]{36}'''
tags = ["github", "token"]

# GitHub OAuth Token
[[rules]]
id = "github-oauth"
description = "GitHub OAuth Token"
regex = '''gho_[a-zA-Z0-9]{36}'''
tags = ["github", "oauth"]

# GitHub App Token
[[rules]]
id = "github-app-token"
description = "GitHub App Token"
regex = '''(ghu|ghs)_[a-zA-Z0-9]{36}'''
tags = ["github", "app"]

# Cloudflare API Token
[[rules]]
id = "cloudflare-api-token"
description = "Cloudflare API Token"
regex = '''[a-zA-Z0-9_-]{40}'''
entropy = 3.0
[rules.allowlist]
paths = [
  '''node_modules/''',
  '''.git/''',
  '''HANDOFF\.md''',
  '''backlog/HANDOFFS\.md''',
  '''backlog/QUEUE\.md''',
  # Retro/follow-up narrative docs — same class as HANDOFFS/QUEUE: prose cites long snake_case
  # constraint/index names and kebab-case phrases (e.g. conversion_labels_tenant_prediction_unique)
  # whose 40-char substrings false-positive on this generic heuristic. Provider-specific secret
  # rules (aws/anthropic/openai/stripe/github/private-key/db-conn) remain active on these paths.
  '''backlog/RETROSPECTIVES\.md''',
  '''backlog/FOLLOW_UPS\.md''',
  # Same class, confirmed 2026-07-02 (PR #414): STATUS.md prose cites the same long kebab-case
  # branch-name strings (e.g. data-engineer/FOLLOW-449-intent-events-session-id-prod) as QUEUE.md's
  # `branch:` field — was missed when QUEUE.md/HANDOFFS.md were exempted; same reasoning applies.
  '''backlog/STATUS\.md''',
  # ADRs and runbooks: prose + cross-reference links cite long kebab-case ADR filenames
  # (e.g. ADR-0014-cross-listing-adaptation-and-sot-archetype) whose 40-char substrings
  # false-positive on this generic heuristic. Provider-specific secret rules stay active here.
  '''docs/adr/''',
  '''docs/runbooks/''',
  '''packages/sdk/src/auto-detect/__fixtures__/''',
  # Python test files use long descriptive method names (test_empty_selectors_list_returns_empty_dict
  # etc.) whose substrings of exactly 40 chars trigger this rule as false positives.
  # Covers both nested (src/jobs/test_*.py) and top-level (src/test_*.py) test modules.
  '''apps/.*/src/.*/test_.*\.py''',
  '''apps/.*/src/test_.*\.py''',
  '''apps/.*/src/.*_test\.py''',
  # Agent lesson/memory files contain prose narratives (kebab phrases, snake_case identifiers)
  # that trigger the cloudflare-api-token heuristic as false positives.
  '''\.claude/agents/''',
  '''memory/''',
]
# k6 official GPG fingerprint used in apt installation instructions
# Transcript filenames (date-slug format, e.g. 2026-05-12-15-49-14-estalara-sprint7-corpus)
# Branch names in QUEUE.md branch: field match [a-zA-Z0-9_-]{40} (false positive)
# FOLLOW-407/FOLLOW-411 CB-1 → CLOSED by FOLLOW-815 (2026-08-07): CANONICAL_CONSENT_TEXT_HASH
# (consent/platform-registration/lib.ts) no longer needs ANY suppression, inline or here, because
# it is no longer a literal. It is now computed at module load —
# computeConsentTextHash(renderPlatformConsentText(FIRST_PARTY_BRAND_IDENTITY)) — so no 64-char
# hex string is committed for this rule to match, and the `// gitleaks:allow` tag that used to sit
# on its line has been REMOVED rather than updated. History, kept because the reasoning matters
# more than the outcome: the constant was a HAND-TYPED placeholder that was the digest of no text
# at all (RETRO-227 §4a LG-1), and FOLLOW-705's correction of this block noted that; deriving it
# rather than re-pinning a new literal is FOLLOW-704's chosen fix and is what removes the
# suppression need entirely. If a future change re-introduces a literal hash here, the
# `consent-text-sync` CI gate fails first (it asserts the constant is still derived) — so an
# unexplained gitleaks hit on this file means that gate was bypassed, not that a tag is missing.
# Line numbers deliberately omitted throughout — every prior citation of this constant drifted.
# No paths or regexes entry needed. If the hash is re-pinned (FOLLOW-704) or rotated, update the
# gitleaks:allow tag on that line to the new value so the inline suppress stays accurate.
regexes = [
  '''C5AD17C747E3415A3642D57D77C6C491D6AC1D69''',
  '''mnt/transcripts/''',
  '''0019_adaptation_decisions_page_context''',
  # ADR kebab filenames (e.g. ADR-0015-feedback-endpoint-authentication) are cited in @see
  # doc-comments inside code modules OUTSIDE docs/adr/ (e.g. lib/api-key-auth.ts). Their 40-char
  # substrings false-positive on this generic heuristic. Token-scoped allowlist per Rule V — do NOT
  # path-ignore the secret-handling file. Real Cloudflare tokens are random, never ADR-NNNN-kebab.
  '''ADR-\d{4}-[a-z0-9-]+''',
  # FOLLOW-609: the bypass-4 CI-guard fixture directory name
  # `bypass4-helper-delegated-mutation-out-of-tx` (43 chars) — cited in the fixture's
  # own doc comment, its sibling fixture's doc comment, and the test harness's
  # run_fixture() call — false-positives on this generic 40-char entropy heuristic
  # (same class as the ADR-NNNN-kebab and agent-branch-slug entries above). Not a
  # secret — a descriptive fixture/test identifier. Token-scoped per Rule V.
  '''bypass4-helper-delegated-mutation(-out-of-tx)?''',
  # FOLLOW-612: same class as the bypass-4 entry above — the bypass-5 CI-guard
  # fixture directory name `bypass5-namespace-import-delegated-mutation(-out-of-tx)`
  # (43/53 chars) is cited in the fixture's own doc comment, its sibling fixture's
  # doc comment, and the test harness's run_fixture() call — false-positives on
  # this generic 40-char entropy heuristic. Unlike the bypass-4 entry (whose base
  # name is only 33 chars, shorter than the 40-char capture window, so the FULL
  # base name is always a substring of the truncated match), this fixture's base
  # name is 43 chars — LONGER than the 40-char capture window — so gitleaks'
  # `[a-zA-Z0-9_-]{40}` rule captures only the first 40 chars
  # (`bypass5-namespace-import-delegated-mutat`, missing the trailing `ion`); a
  # regex requiring the full word "mutation" would never match the truncated
  # capture and this allowlist entry would be silently inert. Verified locally
  # with the gitleaks binary (not added speculatively) — this shorter prefix
  # regex is guaranteed to be a substring of the 40-char capture regardless of
  # which variant (bare or `-out-of-tx`) is matched. Not a secret — a
  # descriptive fixture/test identifier. Token-scoped per Rule V.
  '''bypass5-namespace-import-delegated''',
  # FOLLOW-613: same class as the bypass-4/bypass-5 entries above — the bypass-6
  # CI-guard fixture directory name `bypass6-barrel-reexport-delegated-mutation(-out-of-tx)`
  # (42/52 chars) is cited in the fixture's own doc comment, its sibling fixture's doc
  # comment, and the test harness's run_fixture() call — false-positives on this generic
  # 40-char entropy heuristic (9 findings, all the same string). The base name (42 chars) is
  # LONGER than the 40-char capture window, so — same reasoning as the bypass-5 entry —
  # gitleaks' `[a-zA-Z0-9_-]{40}` rule captures only `bypass6-barrel-reexport-delegated-mutati`
  # (missing the trailing `on`), confirmed against all 9 CI findings (each truncates identically).
  # This shorter prefix is a guaranteed substring of that capture regardless of which variant
  # (bare or `-out-of-tx`) or surrounding context (quote, `#`, `/`, `../../`) precedes it. Not a
  # secret — a descriptive fixture/test identifier. Token-scoped per Rule V.
  '''bypass6-barrel-reexport-delegated''',
  # FOLLOW-622: this PR's own doc-comment citation of
  # `docs/DECISION-BRIEF-FACADES-622-623-2026-07-24.md` (41-char kebab run
  # "DECISION-BRIEF-FACADES-622-623-2026-07-24") false-positives on this generic
  # 40-char entropy heuristic in both `tenant-config-editor.tsx` and
  # `api/config/route.ts` — same class as the ADR-NNNN-kebab entry above (a
  # descriptive doc filename cited in JSDoc outside `docs/adr/`, not a secret).
  # The `[a-zA-Z0-9_-]{40}` rule captures the first 40 chars of the run
  # (`DECISION-BRIEF-FACADES-622-623-2026-07-2`, missing the trailing `4`); this
  # 39-char prefix literal is a guaranteed substring of that capture regardless
  # of surrounding context (backtick, `/`, `.md`). Token-scoped per Rule V.
  '''DECISION-BRIEF-FACADES-622-623-2026-07''',
  # FOLLOW-715: the grace-window env var name `PLATFORM_REGISTRATION_TOS_VERSION_PREVIOUS`
  # (42 chars) is cited in lib.ts/route.ts/route.test.ts (doc comments, `process.env.` reads,
  # `vi.stubEnv()` calls) — same class as the ADR-NNNN-kebab and DECISION-BRIEF entries above (a
  # descriptive identifier, not a secret). The `[a-zA-Z0-9_-]{40}` rule captures the first 40
  # chars (`PLATFORM_REGISTRATION_TOS_VERSION_PREVIO`, missing the trailing `US`) identically in
  # all 11 findings (verified locally with the gitleaks binary against this exact commit). This
  # 40-char literal is the exact capture every time, since the identifier always starts a fresh
  # `[a-zA-Z0-9_-]` run (preceded by `.`, backtick, or a quote, never another matching char).
  # Token-scoped per Rule V.
  '''PLATFORM_REGISTRATION_TOS_VERSION_PREVIO''',
  # FOLLOW-774: `scripts/check-redis-smoke-trigger-trust.sh` originally named its
  # mutation-test helper `compute_hard_fail_required_mutant_inverted_fork` (47
  # chars) — same class as the bypass4/5/6 and ADR-NNNN-kebab entries above (a
  # descriptive shell function identifier, not a secret). The function was
  # renamed to the shorter `compute_hard_fail_required_mutant` (33 chars, under
  # the 40-char capture window) in the very next commit, but gitleaks-action
  # scans the full commit range of a PR, so the OLD name persists in git history
  # regardless of the fix. The `[a-zA-Z0-9_-]{40}` rule captured the first 40
  # chars of the identifier (`compute_hard_fail_required_mutant_invert`,
  # verified against this exact PR's finding — 3 occurrences, all truncating
  # identically since the identifier always starts a fresh alnum/underscore run
  # preceded by a newline, `(`, or `$(`). Token-scoped per Rule V.
  '''compute_hard_fail_required_mutant_invert''',
]

# JWT tokens (generic)
[[rules]]
id = "jwt-token"
description = "JWT token"
regex = '''eyJ[a-zA-Z0-9_-]+\.eyJ[a-zA-Z0-9_-]+\.[a-zA-Z0-9_-]+'''
[rules.allowlist]
description = "Allow test fixtures and examples"
paths = [
  '''tests/''',
  '''test/''',
  '''__tests__/''',
  '''fixtures/''',
  '''examples/''',
  '''docs/''',
]

# Global allowlist for paths
[allowlist]
description = "Global patterns to ignore"
paths = [
  '''\.git/''',
  '''node_modules/''',
  '''pnpm-lock\.yaml''',
  '''package-lock\.json''',
  '''yarn\.lock''',
  '''\.next/''',
  '''dist/''',
  '''build/''',
  '''\.turbo/''',
  '''coverage/''',
  '''\.env\.example$''', # .env.example is safe
  '''\.gitleaks\.toml$''', # This file itself
  # Test fixtures and docs with intentional fake values
  '''tests/fixtures/''',
  '''docs/adr/''',
  '''docs/MASTER_DESIGN\.md''',
  '''CLAUDE\.md''',
  '''packages/sdk/src/__tests__/''',
  '''packages/shared/src/__tests__/''',
  '''packages/db/src/__tests__/''',
  '''apps/control-plane/src/lib/__tests__/''',
  '''apps/control-plane/src/lib/email/__tests__/''',
  '''apps/control-plane/src/__tests__/''',
  '''apps/control-plane/src/app/api/adapt/feedback/route\.test\.ts''',
  # FOLLOW-450 AC4: route-driven PGlite e2e for the feedback loop. Same class as
  # route.test.ts (same dir) and the *route-driven-pglite.test.ts exemption below —
  # the fixture DDL embeds a 40-char snake_case index name
  # (conversion_labels_tenant_prediction_unique → cloudflare-api-token FP) and a
  # fake `sk_live_` test API key (generic-api-key FP). No real secrets.
  '''apps/control-plane/src/app/api/adapt/feedback/route\.follow450-e2e\.test\.ts''',
  # FOLLOW-943: the 403-not-401 origin-refusal test for the same route. Third file in this
  # directory exempted for the same reason as the two above — a fake `pk_live_` fixture key
  # (generic-api-key FP) that the route's SHA-256 key lookup requires in plaintext. No real
  # secrets: the value is hashed in-test and never leaves the file.
  '''apps/control-plane/src/app/api/adapt/feedback/route\.follow943\.test\.ts''',
  '''apps/control-plane/src/app/api/adapt/route\.clickhouse\.test\.ts''',
  '''apps/decision-api/src/lib/__tests__/''',
  '''apps/decision-api/src/__tests__/''',
  # Drizzle-generated migration files use long auto-generated identifier names
  '''packages/db/migrations/''',
  # DB schema files contain long table/index names that match the cloudflare-api-token regex
  '''packages/db/src/schema/''',
  # ClickHouse migration filenames and comments contain long identifiers (table names, column names)
  # that match the cloudflare-api-token regex as false positives.
  '''infra/clickhouse/migrations/''',
  # Test files at the top level of any package's src/ dir (before being moved to __tests__/)
  # contain SQL DDL with long snake_case index names that match the cloudflare-api-token heuristic.
  '''packages/db/src/[^/]+\.test\.ts''',
  '''packages/shared/src/[^/]+\.test\.ts''',
  # Route-driven PGlite integration tests embed fixture DDL with long snake_case index names
  # (e.g. conversion_labels_tenant_prediction_unique = 40 chars) that false-positive on this rule.
  # The same allow-list exemption exists for packages/db/src/__tests__/ (same DDL, same pattern).
  '''apps/control-plane/src/app/api/.*route-driven-pglite\.test\.ts''',
  # Operational runbooks contain SQL DDL, ClickHouse table/column identifiers, migration filenames
  # (e.g. 0019_adaptation_decisions_page_context_source = 45 chars), and Markdown table separator
  # rows (runs of 40+ '-') — all false-positive on the broad cloudflare-api-token heuristic. Same
  # class as the migrations/schema exemptions above; these are prose docs, not secret stores.
  '''docs/runbooks/''',
  # Escalation log: long-form prose with table separators, migration/file identifiers, session and
  # decision UUIDs, and ticket slugs that false-positive on the cloudflare-api-token heuristic.
  '''backlog/ESCALATIONS\.md''',
]

# Regexes for known safe patterns
regexes = [
  '''EXAMPLE''', # Strings containing EXAMPLE are safe
  '''example\.com''', # Example domains
  '''your-api-key-here''', # Placeholder text
  '''INSERT_YOUR_.*_HERE''', # Common placeholder pattern
  '''<YOUR_.*>''', # Another placeholder pattern
  '''xxx''', # Placeholder secrets
  '''test-key-''', # Test API key prefixes (fake values in test files)
  # FOLLOW-435: the event-schema export identifier is exactly 40 chars and
  # false-positives on the broad cloudflare-api-token heuristic (same class as the
  # 40-char snake_case DDL identifiers exempted via paths above). Not a secret.
  '''ListingEmbeddingSeedRequestedEventSchema''',
  # FOLLOW-449 / Rule V: agent branch slugs written into backlog docs (QUEUE.md, STATUS.md)
  # — e.g. `data-engineer/FOLLOW-449-intent-events-session-id-prod` = exactly 40 chars —
  # false-positive on the broad cloudflare-api-token heuristic. Token-scoped exemption for the
  # `<agent>/<ticket>-<kebab>` branch-name pattern (Rule V: never file-scope backlog/*.md, which
  # are decision-grade prose stores that must stay scanned for real secrets). Not a secret.
  '''(?i)(architect|backend-engineer|compliance-engineer|data-engineer|devops-engineer|ml-engineer|pm-orchestrator|qa-engineer|sdk-engineer)/[a-z0-9._-]{3,}''',
  # FOLLOW-461: the adapt.description headline event/payload export identifiers are 40–46
  # chars and false-positive on the broad cloudflare-api-token heuristic (same class as
  # ListingEmbeddingSeedRequestedEventSchema above). TS symbols, not secrets. Token-scoped
  # to the AdaptDescriptionHeadline* prefix.
  '''AdaptDescriptionHeadline[A-Za-z]+''',
]
