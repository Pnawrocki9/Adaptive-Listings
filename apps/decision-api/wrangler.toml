name = "estalara-decision-api"
main = "src/index.ts"
compatibility_date = "2026-04-26"
compatibility_flags = ["nodejs_compat"]

# Account ID is set via CLOUDFLARE_ACCOUNT_ID env var at deploy time
# Never hardcode credentials in this file

[vars]
ENVIRONMENT = "development"

# Development environment (local wrangler dev)
[env.dev]
name = "estalara-decision-api-dev"
vars = { ENVIRONMENT = "development" }

# Staging environment (auto-deploy on merge to main)
[env.staging]
name = "estalara-decision-api-staging"
vars = { ENVIRONMENT = "staging" }

[[env.staging.routes]]
pattern = "api-staging.estalara.io/*"
zone_name = "estalara.io"

# Production environment (manual deploy with human approval)
[env.production]
name = "estalara-decision-api-production"
vars = { ENVIRONMENT = "production" }

[[env.production.routes]]
pattern = "api.estalara.io/*"
zone_name = "estalara.io"

# Production configuration is managed via Terraform in infra/terraform/cloudflare/
# Secrets are managed via Doppler — never commit .env files
