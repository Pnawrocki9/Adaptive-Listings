name = "estalara-ingest"
main = "src/index.ts"
compatibility_date = "2026-04-26"
compatibility_flags = ["nodejs_compat"]

# Account ID is set via CLOUDFLARE_ACCOUNT_ID env var at deploy time
# Never hardcode credentials in this file

[vars]
ENVIRONMENT = "development"
# Redpanda HTTP REST proxy (Pandaproxy). Empty = no-bus guard active (Phase 1 mode).
# Set to the Pandaproxy URL when Redpanda is activated in Phase 3.
# TODO(RUNTIME-FIX-004): Set to real URL when Redpanda is activated in Phase 3.
# Note (ESC-017): Redpanda Cloud Serverless does not expose Pandaproxy. The
# direct ClickHouse-write path (vars below) replaces this hop for the pilot.
REDPANDA_REST_URL = ""
REDPANDA_TOPIC_EVENTS = "events"
# ClickHouse Cloud HTTPS interface (ESC-017 pilot path).
# CLICKHOUSE_URL is non-secret (hostname). CLICKHOUSE_USER, CLICKHOUSE_PASSWORD,
# and (if used) CLICKHOUSE_DATABASE override go in via `wrangler secret put`.
# Empty CLICKHOUSE_URL triggers the no-cred guard (events validated but not
# persisted) — same Phase-1 semantic as the Redpanda no-bus guard.
CLICKHOUSE_URL = ""
CLICKHOUSE_DATABASE = "default"
# Observability (TICKET-018) — secrets injected by Doppler at deploy time.
# SENTRY_DSN_INGEST and OTEL_EXPORTER_HEADERS must be set as Worker secrets.
OTEL_EXPORTER_URL = ""
OTEL_EXPORTER_HEADERS = ""

# KV namespace for API key → tenant lookup (replaces with Postgres in Sprint 2 / TICKET-021).
# `id` is set per-environment via Terraform (infra/terraform/cloudflare/) and Doppler-injected
# at deploy time. The `preview_id` is used by `wrangler dev`.
[[kv_namespaces]]
binding = "KV_API_KEYS"
id = "523aafacf2d54201a33631d62ba801e3"
preview_id = "523aafacf2d54201a33631d62ba801e3"

# KV namespace for idempotency key deduplication (TICKET-019).
# Stores batch responses keyed by `idem:<Idempotency-Key>` with a 24-hour TTL.
# One KV entry per ingest batch (not per event) to keep write costs bounded.
# `id` is provisioned via Terraform (infra/terraform/cloudflare/); Doppler injects at deploy time.
[[kv_namespaces]]
binding = "KV_IDEMPOTENCY"
id = "0603c2833a7a46e2890fb885319d813c"
preview_id = "0603c2833a7a46e2890fb885319d813c"

# Durable Objects binding for per-tenant rate limiting (TICKET-013).
# `class_name` matches the export from src/index.ts. No `script_name` — the class lives in this
# same Worker, not an external one.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

# DO migrations — required when introducing or renaming DO classes. Increment `tag` when schema
# changes; keep historical entries so already-deployed environments can fast-forward.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# Cloudflare Queue — durable retry buffer for the post-ACK ClickHouse `events` insert
# (FOLLOW-482 / ADR-0017, ACCEPTED by CEO 2026-07-06, ESC-037). Producer:
# `handlers/events.ts` enqueues a chunked `EventsRetryMessage` on terminal ClickHouse failure
# (after the in-process 3-attempt retry is exhausted). Consumer: the `queue()` handler exported
# from `src/index.ts` re-inserts via the same `pushToClickHouse` path used on the primary
# insert; ack on success, `retry()` on failure — Cloudflare's native per-message retry
# (`max_retries` below) and DLQ take it from there, no bespoke backoff/DLQ code.
# `estalara-events-retry` + `estalara-events-retry-dlq` are provisioned via
# `wrangler queues create` / Terraform (infra/terraform/cloudflare/) — a devops/operator
# deploy-time step, not created by this file.
[[queues.producers]]
binding = "EVENTS_RETRY_QUEUE"
queue = "estalara-events-retry"

# DLQ producer binding — not consumed by code (ADR-0017 Decision §1); inspected/replayed via
# `wrangler queues consumer` or the Cloudflare dashboard. Alert/runbook ownership: devops
# (FOLLOW-495).
[[queues.producers]]
binding = "EVENTS_RETRY_DLQ"
queue = "estalara-events-retry-dlq"

[[queues.consumers]]
queue = "estalara-events-retry"
max_retries = 5
dead_letter_queue = "estalara-events-retry-dlq"
max_batch_size = 25
max_batch_timeout = 5

# Development environment (local wrangler dev)
# MODAL_CHAT_NLP_URL points at the LOCAL intent-engine shim
# (`uvicorn local_dev:app --port 8090 --app-dir src`, apps/intent-engine/README.md),
# never at Modal — FOLLOW-817 AC(4), re-scoped from "staging" by the ESC-052 ruling
# (there is no staging data plane; `stg` Doppler IS production). The matching
# INTERNAL_API_SECRET is a local-only value and belongs in apps/ingest/.dev.vars,
# which is gitignored. Prod stays unset here and is deferred to FOLLOW-820.
[env.dev]
name = "estalara-ingest-dev"
vars = { ENVIRONMENT = "development", REDPANDA_REST_URL = "", REDPANDA_TOPIC_EVENTS = "events", CLICKHOUSE_URL = "", CLICKHOUSE_DATABASE = "default", OTEL_EXPORTER_URL = "", OTEL_EXPORTER_HEADERS = "", MODAL_CHAT_NLP_URL = "http://localhost:8090/chat_nlp_endpoint" }

# "Staging" environment — NOT an environment. A wrangler BUILD/UPLOAD SMOKE target.
#
# CORRECTED 2026-08-07 (FOLLOW-878 / ESC-052 RESOLVED, CEO option 2). This comment
# previously read "Staging environment (auto-deploy on merge to main)". Both halves
# were false and had been for the block's entire life:
#   - There is no staging data plane. CLICKHOUSE_URL is deliberately "" (the no-cred
#     guard), no KV/DO/queue bindings are declared, and Doppler `stg` carries no
#     CLICKHOUSE_* at all. This Worker writes zero rows by configuration.
#   - Nothing auto-deploys. `.github/workflows/deploy-staging.yml` is
#     `workflow_dispatch`-only and its own header calls itself a bundle/upload smoke.
#   - `ingest-staging.estalara.com` has NO DNS record (FOLLOW-810, verified live
#     2026-08-04): it falls through the `*.estalara.com` wildcard to a non-Cloudflare
#     host presenting a self-signed `CN=TRAEFIK DEFAULT CERT`. A green
#     `Uploaded`+`Deployed` is the whole signal.
# Do not add secrets, bindings or a Doppler `stg` reference here expecting isolation:
# a write to `stg` is a write to production. Enforced by
# scripts/check-no-staging-plane.sh. See docs/runbooks/INGEST_WORKER_DEPLOY.md §3.
[env.staging]
name = "estalara-ingest-staging"
vars = { ENVIRONMENT = "staging", REDPANDA_REST_URL = "", REDPANDA_TOPIC_EVENTS = "events-staging", CLICKHOUSE_URL = "", CLICKHOUSE_DATABASE = "default", OTEL_EXPORTER_URL = "", OTEL_EXPORTER_HEADERS = "" }

[[env.staging.routes]]
pattern = "ingest-staging.estalara.com/*"
zone_name = "estalara.com"

# Production environment (manual deploy with human approval)
[env.production]
name = "estalara-ingest-production"
vars = { ENVIRONMENT = "production", REDPANDA_REST_URL = "", REDPANDA_TOPIC_EVENTS = "events", CLICKHOUSE_URL = "https://hl0kc83gt4.eu-west-1.aws.clickhouse.cloud:8443", CLICKHOUSE_DATABASE = "default", OTEL_EXPORTER_URL = "", OTEL_EXPORTER_HEADERS = "" }

[[env.production.routes]]
pattern = "ingest.estalara.com/*"
zone_name = "estalara.com"

[[env.production.kv_namespaces]]
binding = "KV_API_KEYS"
id = "523aafacf2d54201a33631d62ba801e3"
preview_id = "523aafacf2d54201a33631d62ba801e3"

[[env.production.kv_namespaces]]
binding = "KV_IDEMPOTENCY"
id = "0603c2833a7a46e2890fb885319d813c"
preview_id = "0603c2833a7a46e2890fb885319d813c"

[[env.production.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[env.production.queues.producers]]
binding = "EVENTS_RETRY_QUEUE"
queue = "estalara-events-retry"

[[env.production.queues.producers]]
binding = "EVENTS_RETRY_DLQ"
queue = "estalara-events-retry-dlq"

[[env.production.queues.consumers]]
queue = "estalara-events-retry"
max_retries = 5
dead_letter_queue = "estalara-events-retry-dlq"
max_batch_size = 25
max_batch_timeout = 5

# Production configuration is managed via Terraform in infra/terraform/cloudflare/
# Secrets are managed via Doppler — never commit .env files
# Secrets set via `wrangler secret put`:
#   SENTRY_DSN_INGEST      — Sentry DSN for ingest project
#   OTEL_EXPORTER_HEADERS  — Authorization header for Grafana Cloud OTLP
#   FIRST_PARTY_TENANT_ID  — UUID of Estalara's own tenant (FOLLOW-658). Not secret, but set via
#     `wrangler secret put` so it can be configured without a code change + redeploy. Enables the
#     origin-gate provisioning guard: any OTHER tenant still on the `inherit` policy has an
#     un-seeded api-key KV record and is refused 403 `origin_policy_unconfigured` instead of
#     silently inheriting Estalara's own allow-list. UNSET, blank, OR malformed (not a well-formed
#     UUID once trimmed + lower-cased — FOLLOW-678) = guard off (pre-FOLLOW-658 behavior for every
#     tenant), so a forgotten OR garbled value can never black-hole first-party traffic. A value
#     that IS a well-formed UUID but the WRONG one is NOT safe — it 403s every first-party browser
#     request with `origin_policy_unconfigured`; run the post-flip verification probe in
#     INGEST_WORKER_DEPLOY.md / BRAND_PROVISIONING.md §Step 0 after setting it.
#     Same value as the control-plane env of the same name (BRAND_PROVISIONING §Step 0).
#   INTERNAL_API_SECRET    — Bearer shared with Modal chat_nlp_endpoint (F-01)
#   MODAL_CHAT_NLP_URL     — HTTPS URL of intent-engine chat_nlp_endpoint (F-01 / ADR-0016)
#     e.g. https://<workspace>--estalara-intent-engine-chat-nlp-endpoint.modal.run
#     Empty = skip chat-NLP dispatch (shadow path stays inert until provisioned).
