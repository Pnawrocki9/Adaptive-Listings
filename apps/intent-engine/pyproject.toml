[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "estalara-intent-engine"
version = "0.0.0"
description = "Estalara intent-engine — Modal serverless Python service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.28",
  "modal>=0.73",
  "upstash-redis>=1.0",
  "sentry-sdk>=2.0",
  "pydantic>=2.7",
  "fastapi>=0.110",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "mypy>=1.9.0",
  "ruff>=0.4.0",
  "black>=24.0.0",
  # local-dev ASGI server for src/local_dev.py (FOLLOW-729) — not needed by the
  # deployed Modal path, so kept out of the top-level `dependencies` / image.
  "uvicorn>=0.29",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
