[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "estalara-llm-gateway"
version = "0.0.0"
description = "Estalara llm-gateway — Modal serverless Python service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.28",
  "httpx>=0.27",
  "confluent-kafka>=2.4",
  "modal>=0.73",
  "sentry-sdk>=2.0",
  "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "mypy>=1.9.0",
  "ruff>=0.4.0",
  "black>=24.0.0",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["src"]
# Put src/ on sys.path so nested tests (src/jobs/test_*.py) can `import jobs.generate_description`.
# Without this the jobs/ package is only importable as src.jobs.* and collection fails with
# ModuleNotFoundError. (src/__init__.py exists per repo convention, so prepend-mode roots at the
# app dir; pythonpath restores the bare-package import the tests use.)
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
