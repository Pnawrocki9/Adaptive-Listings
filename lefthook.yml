pre-push:
  commands:
    rule-h:
      run: bash scripts/check-rule-h.sh origin/main
    rule-j:
      run: bash scripts/check-mirror-files.sh

pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,tsx,js,jsx,json,yaml,yml,md,css}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{ts,tsx,js,jsx}"
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    gitleaks:
      run: |
        # Run gitleaks on staged files only
        # If gitleaks binary is not found, skip with warning (CI will catch it)
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks protect --staged --no-banner --redact
        else
          echo "⚠️  gitleaks not installed locally. Install via: brew install gitleaks"
          echo "    Secrets will be checked in CI. To install now, see: https://github.com/gitleaks/gitleaks#installing"
        fi

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
